<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"></head>
<body style="margin:0">
<title>Snake 3D — Dal Bosco al Lago</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#071f0d; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
  .hud-top { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:10px; right:10px;
             display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .panel { background:rgba(5,25,10,.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.15);
           border-radius:14px; padding:6px 12px; color:#eafbe7; }
  #scoreBox { font-size:clamp(16px,4.5vw,26px); font-weight:800; letter-spacing:.5px; }
  #scoreBox small { display:block; font-size:.5em; font-weight:600; opacity:.75; }
  #comboBox { color:#ffd54a; font-weight:800; font-size:clamp(12px,3.5vw,18px); margin-top:2px;
              opacity:0; transition:opacity .2s, transform .2s; transform:scale(.8); }
  #comboBox.on { opacity:1; transform:scale(1); }
  #levelBox { text-align:center; }
  #levelName { font-size:clamp(11px,3vw,15px); font-weight:700; color:#c9f2c0; }
  #progressOuter { width:min(34vw,180px); height:8px; background:rgba(255,255,255,.18); border-radius:6px; margin-top:5px; overflow:hidden; }
  #progressInner { height:100%; width:0%; background:linear-gradient(90deg,#7ddf64,#ffd54a); border-radius:6px; transition:width .3s; }
  #livesBox { font-size:clamp(14px,4vw,20px); letter-spacing:2px; }
  #effects { position:absolute; top:calc(64px + env(safe-area-inset-top)); left:10px; display:flex; flex-direction:column; gap:5px; }
  .fx { display:flex; align-items:center; gap:6px; background:rgba(5,25,10,.55); border:1px solid rgba(255,255,255,.15);
        border-radius:10px; padding:3px 8px; color:#fff; font-size:12px; font-weight:700; }
  .fx .bar { width:52px; height:5px; background:rgba(255,255,255,.2); border-radius:3px; overflow:hidden; }
  .fx .bar i { display:block; height:100%; background:#fff; border-radius:3px; }

  /* buttons top-right column */
  .hud-btns { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:10px; display:flex; flex-direction:column; gap:8px; pointer-events:auto; }
  .cbtn { width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.25);
          background:rgba(5,25,10,.6); color:#eafbe7; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cbtn:active { background:rgba(255,255,255,.25); }
  #hud .hud-btns { top:auto; bottom:calc(20px + env(safe-area-inset-bottom)); right:14px; }

  /* ---------- Joystick ---------- */
  #joyZone { position:fixed; left:0; bottom:0; width:55%; height:55%; z-index:12; display:none; pointer-events:auto; }
  #joyBase { position:absolute; width:132px; height:132px; border-radius:50%;
             background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.16), rgba(0,0,0,.35));
             border:2px solid rgba(255,255,255,.28); left:34px; bottom:calc(34px + env(safe-area-inset-bottom));
             transition:opacity .25s; }
  #joyKnob { position:absolute; width:58px; height:58px; border-radius:50%; left:37px; top:37px;
             background:radial-gradient(circle at 35% 30%, #b8ffb0, #3f9e46 70%);
             box-shadow:0 4px 14px rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.5); }
  #joyBase .arrow { position:absolute; color:rgba(255,255,255,.5); font-size:14px; }
  .a-up{top:6px;left:50%;transform:translateX(-50%);} .a-dn{bottom:6px;left:50%;transform:translateX(-50%);}
  .a-lf{left:8px;top:50%;transform:translateY(-50%);} .a-rt{right:8px;top:50%;transform:translateY(-50%);}

  /* ---------- Overlays ---------- */
  .overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(4,18,8,.82); backdrop-filter:blur(8px); color:#eafbe7; text-align:center; padding:20px; }
  .hidden { display:none !important; }
  h1.title { font-size:clamp(34px,9vw,64px); font-weight:900; letter-spacing:1px;
             background:linear-gradient(180deg,#c8ff9e,#4caf50 55%,#1b5e20); -webkit-background-clip:text; background-clip:text; color:transparent;
             filter:drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
  .subtitle { font-size:clamp(13px,3.5vw,18px); color:#bce8b0; margin:6px 0 24px; }
  .bigbtn { pointer-events:auto; font-size:clamp(18px,5vw,26px); font-weight:800; color:#08220e; border:none; cursor:pointer;
            background:linear-gradient(180deg,#b6f397,#5fbf4f); padding:14px 52px; border-radius:40px;
            box-shadow:0 6px 0 #2e7d32, 0 10px 24px rgba(0,0,0,.5); margin:8px 0; }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 2px 0 #2e7d32; }
  .bigbtn.secondary { background:linear-gradient(180deg,#ffe082,#ffb300); box-shadow:0 6px 0 #b26a00, 0 10px 24px rgba(0,0,0,.5); }
  .bigbtn.secondary:active { box-shadow:0 2px 0 #b26a00; }
  .menurow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .stat { font-size:clamp(14px,4vw,18px); margin:4px 0; color:#ffe9a8; font-weight:700; }

  #levelSelect { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:560px; margin:14px 0 6px; }
  .lvbtn { width:64px; height:64px; border-radius:14px; border:2px solid rgba(255,255,255,.3); cursor:pointer;
           color:#fff; font-weight:800; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .lvbtn small { font-size:9px; font-weight:600; opacity:.9; }
  .lvbtn.locked { filter:grayscale(1) brightness(.5); }
  .lvbtn.sel { outline:3px solid #ffd54a; }

  .setrow { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:15px; }
  .toggle { padding:8px 16px; border-radius:20px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff; cursor:pointer; font-weight:700; }
  .toggle.on { background:#5fbf4f; border-color:#8ee27e; color:#062b0e; }

  #foodLegend { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px; max-width:600px; margin-top:16px;
                font-size:12px; color:#d7f5cf; text-align:left; max-height:30vh; overflow-y:auto; padding:0 6px; touch-action:pan-y; }
  #foodLegend div { background:rgba(255,255,255,.07); border-radius:8px; padding:6px 8px; }

  /* level intro */
  #levelIntro h2 { font-size:clamp(26px,7vw,44px); color:#ffe9a8; }
  #levelIntro p { margin-top:8px; font-size:clamp(14px,4vw,18px); color:#cdeec4; }

  /* toast */
  #toast { position:fixed; top:22%; left:50%; transform:translate(-50%,0); z-index:15; pointer-events:none;
           font-size:clamp(18px,5.5vw,30px); font-weight:900; color:#ffd54a; text-shadow:0 2px 10px rgba(0,0,0,.7);
           opacity:0; transition:opacity .3s, transform .3s; }
  #toast.show { opacity:1; transform:translate(-50%,-14px); }

  #flash { position:fixed; inset:0; background:#ff2020; opacity:0; pointer-events:none; z-index:14; transition:opacity .5s; }

  #pauseOverlay h2, #gameoverOverlay h2 { font-size:clamp(30px,8vw,52px); margin-bottom:10px; }
  #gameoverOverlay h2 { color:#ff8a65; }
  .credits { position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); font-size:11px; color:rgba(255,255,255,.45); }
</style>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hud-top">
    <div class="panel" id="scoreBox">0<small>RECORD <span id="bestInline">0</span></small>
      <div id="comboBox">COMBO ×2</div>
    </div>
    <div class="panel" id="levelBox">
      <div id="levelName">Bosco Fitto</div>
      <div id="progressOuter"><div id="progressInner"></div></div>
    </div>
    <div class="panel" id="livesBox">❤❤❤</div>
  </div>
  <div id="effects"></div>
  <div class="hud-btns">
    <button class="cbtn" id="btnPause" aria-label="Pausa">⏸</button>
    <button class="cbtn" id="btnCam" aria-label="Telecamera">🎥</button>
    <button class="cbtn" id="btnSound" aria-label="Audio">🔊</button>
  </div>
</div>

<!-- Joystick -->
<div id="joyZone">
  <div id="joyBase">
    <span class="arrow a-up">▲</span><span class="arrow a-dn">▼</span>
    <span class="arrow a-lf">◀</span><span class="arrow a-rt">▶</span>
    <div id="joyKnob"></div>
  </div>
</div>

<div id="toast"></div>
<div id="flash"></div>

<!-- MENU -->
<div class="overlay" id="menuOverlay">
  <h1 class="title">SNAKE 3D</h1>
  <div class="subtitle">🌲 Dal Bosco al Lago 🌊 — un'avventura strisciante</div>
  <div class="stat">🏆 Record: <span id="bestMenu">0</span></div>
  <div id="levelSelect"></div>
  <button class="bigbtn" id="btnPlay">▶ GIOCA</button>
  <div class="menurow">
    <button class="bigbtn secondary" id="btnHow" style="font-size:15px;padding:10px 24px;">📖 Cibi &amp; Poteri</button>
    <button class="bigbtn secondary" id="btnFull" style="font-size:15px;padding:10px 24px;">⛶ Schermo intero</button>
  </div>
  <div class="setrow">Controlli:
    <button class="toggle on" id="ctlJoy">🕹 Joypad</button>
    <button class="toggle on" id="ctlSwipe">👆 Swipe</button>
  </div>
  <div id="foodLegend" class="hidden"></div>
  <div class="credits">Creato con Three.js — funziona offline, salva i tuoi record</div>
</div>

<!-- LEVEL INTRO -->
<div class="overlay hidden" id="levelIntro">
  <h2 id="introTitle">Livello 1</h2>
  <p id="introDesc"></p>
</div>

<!-- PAUSE -->
<div class="overlay hidden" id="pauseOverlay">
  <h2>⏸ PAUSA</h2>
  <button class="bigbtn" id="btnResume">▶ RIPRENDI</button>
  <button class="bigbtn secondary" id="btnQuit">🏠 MENU</button>
</div>

<!-- GAME OVER -->
<div class="overlay hidden" id="gameoverOverlay">
  <h2>💀 GAME OVER</h2>
  <div class="stat">Punteggio: <span id="goScore">0</span></div>
  <div class="stat" id="goBestRow">🏆 Record: <span id="goBest">0</span></div>
  <div class="stat hidden" id="goNewRecord" style="color:#7dffb0;">🎉 NUOVO RECORD! 🎉</div>
  <button class="bigbtn" id="btnRetry">↻ RIGIOCA</button>
  <button class="bigbtn secondary" id="btnMenu2">🏠 MENU</button>
</div>
