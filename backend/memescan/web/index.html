<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>memescan</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
  :root {
    --bg: #0b0e14;
    --surface: #141922;
    --surface-2: #1c2230;
    --border: #262d3d;
    --text: #e6e9ef;
    --muted: #8b94a7;
    --green: #3ddc84;
    --yellow: #f5c542;
    --red: #ff5c5c;
    --blue: #5b9dff;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Struttura da applicazione: la pagina occupa esattamente lo schermo e non
     scorre. A scorrere e' solo la lista in mezzo, cosi' intestazione e barra
     di navigazione restano sempre al loro posto invece di sparire a meta'
     quando si trascina. 100dvh tiene conto della barra del browser che sui
     telefoni compare e scompare. */
  html { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    background: rgba(11,14,20,.94);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--muted); font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .stats { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); overflow-x: auto; }
  .stats b { color: var(--text); font-weight: 600; }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 14px 12px;
    display: grid;
    gap: 10px;
    /* Senza questo, con poche schede in elenco si stirerebbero in altezza. */
    align-content: start;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .card.alerted { border-color: rgba(61,220,132,.35); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .sym { font-weight: 700; font-size: 16px; }
  .name { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .score {
    min-width: 46px; text-align: center; font-weight: 700; font-size: 15px;
    padding: 4px 8px; border-radius: 10px; background: var(--surface-2);
  }
  .score.hi { color: var(--green); background: rgba(61,220,132,.12); }
  .score.mid { color: var(--yellow); background: rgba(245,197,66,.12); }
  .score.lo { color: var(--muted); }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 8px; }
  .metric { background: var(--surface-2); border-radius: 9px; padding: 6px 4px; text-align: center; }
  .metric small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .metric b { font-size: 13px; font-weight: 600; }
  .up { color: var(--green); } .down { color: var(--red); }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--surface-2); color: var(--muted); }
  .tag.ok { color: var(--green); background: rgba(61,220,132,.1); }
  .tag.warn { color: var(--yellow); background: rgba(245,197,66,.1); }
  .tag.bad { color: var(--red); background: rgba(255,92,92,.1); }
  .tag.wallet { color: var(--blue); background: rgba(91,157,255,.14); font-weight: 600; }
  /* Da dove arriva l'alert: le balene sono un segnale diverso dal punteggio. */
  .tag.kind { font-weight: 700; letter-spacing: .3px; }
  .tag.kind.whales { color: var(--blue); background: rgba(91,157,255,.16); }
  .tag.kind.scanner { color: var(--green); background: rgba(61,220,132,.12); }
  .tag.kind.scaduto { color: var(--muted); background: var(--surface-2); }
  .tag.kind.entrambi {
    color: var(--text);
    background: linear-gradient(90deg, rgba(61,220,132,.18), rgba(91,157,255,.2));
  }

  .filters { display: flex; gap: 6px; margin-bottom: 2px; }
  .filters button {
    flex: 1; background: var(--surface); color: var(--muted);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 8px 4px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .filters button.on { color: var(--text); border-color: var(--muted); background: var(--surface-2); }

  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .actions a, .actions button {
    flex: 1; text-align: center; text-decoration: none;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 4px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .actions button:active, .actions a:active { background: var(--border); }

  nav {
    flex: 0 0 auto;
    display: grid; grid-template-columns: repeat(6, 1fr);
    background: rgba(20,25,34,.97);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  /* La riga dell'icona ha un'altezza fissa, non quella del glifo che ci
     capita dentro. Senza, ogni bottone e' una griglia per conto suo e la
     scritta parte da dove finisce la sua icona: la ★ e' l'unico carattere non
     emoji della barra, sul telefono arriva da un altro font con altezze
     diverse, e "Salvati" scendeva piu' in basso delle altre cinque. Cosi' la
     scritta sta allo stesso punto qualunque cosa ci sia sopra. */
  nav button {
    background: none; border: 0; color: var(--muted); font-family: inherit;
    padding: 12px 2px; font-size: 10px; cursor: pointer;
    display: grid; grid-template-rows: 21px auto; gap: 3px;
    justify-items: center; align-content: center;
  }
  nav button.active { color: var(--green); }
  nav button i {
    font-style: normal; font-size: 17px; line-height: 1; position: relative;
    height: 21px; display: flex; align-items: center; justify-content: center;
  }
  /* Il pallino rosso sul numero di avvisi non ancora aperti. Sta attaccato
     all'icona e non alla scritta, cosi' non allarga la colonna: con sei
     schede lo spazio in larghezza e' finito. */
  nav button i b {
    position: absolute; top: -4px; left: 11px;
    min-width: 15px; padding: 0 3px; box-sizing: border-box;
    background: var(--red); color: #fff; border-radius: 8px;
    font-size: 9px; font-weight: 700; line-height: 15px; text-align: center;
  }
  nav button i b:empty { display: none; }

  .empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 14px; }
  .empty b { display: block; color: var(--text); margin-bottom: 6px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); padding: 10px 12px; font: inherit; font-size: 14px;
  }
  .btn {
    width: 100%; margin-top: 14px; background: var(--green); color: #06210f;
    border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(84px + env(safe-area-inset-bottom));
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 9px 16px; border-radius: 20px; font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>memescan <span id="chain">robinhood</span></h1>
    <div class="row" style="gap:6px">
      <span class="dot" id="health-dot"></span>
      <button id="refresh" style="background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer">⟳</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="live" class="active"><i>📡</i>Live</button>
  <button data-tab="alerts"><i>🔔</i>Alert</button>
  <button data-tab="notifiche"><i>🚨<b id="pallino"></b></i>Avvisi</button>
  <button data-tab="saved"><i>★</i>Salvati</button>
  <button data-tab="wallets"><i>🐋</i>Whales</button>
  <button data-tab="settings"><i>⚙️</i>Setup</button>
</nav>

<div class="toast" id="toast"></div>

<script>
// Nell'APK la pagina e' servita da http://localhost, che non e' il backend:
// MEMESCAN_DEFAULT_BASE viene iniettato in fase di build e fa da default,
// sempre sovrascrivibile dalla scheda Setup.
const store = {
  get base() {
    return localStorage.getItem('base') || window.MEMESCAN_DEFAULT_BASE || location.origin;
  },
  set base(v) { localStorage.setItem('base', v.replace(/\/$/, '')); },
  get token() { return localStorage.getItem('token') || ''; },
  set token(v) { localStorage.setItem('token', v); },
};

let tab = 'live';
// null = non ancora scelto: la prima apertura mostra la casella piu' piena,
// cosi' non si finisce su una schermata vuota senza capire perche'.
let alertFilter = null;
let timer = null;

function setAlertFilter(value) {
  alertFilter = value;
  render();
}

// Quello che si sta scrivendo sopravvive a tutto: all'aggiornamento
// automatico, al ritorno da un'altra applicazione, e soprattutto alla
// ricarica completa che Android fa quando riporta l'app in primo piano.
// Senza, per configurare il backup bisognerebbe ricordarsi a memoria un
// token di ottanta caratteri, cioe' non si potrebbe fare.
const bozza = {
  chiave: (id) => 'bozza:' + id,
  salva(el) {
    if (el.value) localStorage.setItem(this.chiave(el.id), el.value);
    else localStorage.removeItem(this.chiave(el.id));
  },
  ripristina() {
    document.querySelectorAll('input[data-bozza]').forEach((el) => {
      const salvato = localStorage.getItem(this.chiave(el.id));
      // Solo se la casella e' vuota: quello che arriva dal server non va
      // sovrascritto da una bozza vecchia.
      if (salvato && !el.value) el.value = salvato;
    });
  },
  pulisci(...ids) {
    ids.forEach((id) => localStorage.removeItem(this.chiave(id)));
  },
};

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (store.token) headers['X-API-Token'] = store.token;
  const res = await fetch(store.base + path, { ...options, headers });
  if (!res.ok) throw new Error(res.status === 401 ? 'Token API non valido' : 'HTTP ' + res.status);
  return res.json();
}

const usd = (n) => {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
  if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
};

const age = (ts) => {
  if (!ts) return 'n/d';
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'g';
};

// L'ora esatta in cui e' partita la segnalazione, non "quanto tempo fa".
// Serve a incrociarla a mano con l'ora in cui la pozza e' sparita: due "5h
// fa" letti a mezz'ora di distanza non si possono sottrarre, due orari si'.
// Il giorno compare solo quando non e' oggi, altrimenti una chiamata di ieri
// alle 22:10 e una di oggi alle 22:10 sarebbero indistinguibili.
const quando = (ts) => {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const ora = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  const oggi = new Date();
  const stessoGiorno = d.getDate() === oggi.getDate()
    && d.getMonth() === oggi.getMonth() && d.getFullYear() === oggi.getFullYear();
  return stessoGiorno ? ora : `${d.getDate()}/${d.getMonth() + 1} ${ora}`;
};

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
));

function scoreClass(s) { return s >= 80 ? 'hi' : s >= 65 ? 'mid' : 'lo'; }

// Un alert puo' arrivare dal punteggio del bot, dai wallet che seguiamo o da
// entrambi: sono segnali di natura diversa e vanno letti a colpo d'occhio.
const KINDS = {
  whales: {
    label: '🐋 WHALES', short: '🐋 Whales', cls: 'whales',
    vuoto: ['Nessun token delle sole whales', 'Qui finiscono i token comprati dalle whales che lo scanner da solo non avrebbe segnalato.'],
  },
  scanner: {
    label: '📡 SCANNER', short: '📡 Scanner', cls: 'scanner',
    vuoto: ['Nessun token del solo scanner', 'Qui finiscono i token che superano la soglia con le loro forze, senza whales dentro.'],
  },
  scanner_whales: {
    label: '📡 + 🐋 SCANNER + WHALES', short: '📡 + 🐋', cls: 'entrambi',
    vuoto: ['Nessun token con tutti e due i segnali', 'Qui finiscono i token che lo scanner consiglia da soli e che le whales hanno comprato.'],
  },
  // Non ha un pulsante: e' un alert il cui motivo e' decaduto, non una
  // categoria in cui cercare qualcosa da comprare.
  scaduto: {
    label: '🕓 SCADUTO', short: '🕓 Scaduti', cls: 'scaduto',
    vuoto: ['Nessun alert scaduto', 'Qui finiscono i token che le whales hanno rivenduto e che da soli non reggono la soglia.'],
  },
};

// Gli alert mandati prima di questa modifica non hanno l'origine registrata.
// Il server la ricalcola a ogni giro, quindi e' una situazione che dura pochi
// minuti: nel frattempo si sceglie la casella piu' prudente, perche' dire
// "tutti e due i segnali" quando non e' vero e' l'errore che costa di piu'.
function kindOf(c) {
  if (KINDS[c.alert_kind]) return c.alert_kind;
  return c.wallet_hits > 0 ? 'whales' : 'scaduto';
}

function safetyTags(c) {
  const s = c.safety || {};
  const tags = [];
  if (c.status === 'alerted') {
    const k = KINDS[kindOf(c)];
    tags.push(`<span class="tag kind ${k.cls}">${k.label}</span>`);
  }
  // Il punteggio senza i punti delle whales: e' il numero che spiega in quale
  // casella e' finito il token, e distingue chi vale di suo da chi sta in
  // piedi solo perche' l'ha comprato qualcuno di bravo.
  const own = Number(c.breakdown?.own);
  if (own > 0 && own < Number(c.score)) {
    tags.push(`<span class="tag">da solo ${Math.round(own)}</span>`);
  }
  // "ora" perche' e' il dato di adesso, mentre l'etichetta qui sopra dice da
  // dove arriva l'alert: senza quella parola le due scritte sembrano in
  // contraddizione quando le balene entrano dopo la segnalazione.
  if (c.wallet_hits > 0) {
    tags.push(`<span class="tag wallet">🐋 ${c.wallet_hits} whales ora</span>`);
  }
  const verdictClass = { pulito: 'ok', accettabile: 'ok', rischioso: 'warn', pericoloso: 'bad' };
  if (s.verdict) tags.push(`<span class="tag ${verdictClass[s.verdict] || ''}">${esc(s.verdict)}</span>`);
  if (s.ownership_renounced) tags.push('<span class="tag ok">owner rinunciato</span>');
  if (s.lp_burned_pct >= 95) tags.push('<span class="tag ok">LP bruciata</span>');
  if (s.verified) tags.push('<span class="tag ok">verificato</span>');
  // La tassa di vendita: decide se il guadagno sulla carta si puo' incassare
  // davvero. Manca (undefined) sui candidati salvati prima di questo controllo.
  if (s.sell_tax > 0) {
    tags.push(`<span class="tag ${s.sell_tax > 10 ? 'bad' : 'warn'}">vendita -${Math.round(s.sell_tax)}%</span>`);
  } else if (s.sell_tax === 0) {
    tags.push('<span class="tag ok">vendita libera</span>');
  }
  if (s.top10_pct > 0) {
    const cls = s.top10_pct > 35 ? 'warn' : '';
    tags.push(`<span class="tag ${cls}">top10 ${Math.round(s.top10_pct)}%</span>`);
  }
  (s.flags || []).filter((f) => f.level === 'warn').slice(0, 2)
    .forEach((f) => tags.push(`<span class="tag warn">${esc(f.message)}</span>`));
  return tags.join('');
}

function card(c) {
  const chg = Number(c.price_change_1h) || 0;
  const peak = Number(c.peak_multiple) || 0;
  return `
  <div class="card ${c.status === 'alerted' ? 'alerted' : ''}">
    <div class="row between">
      <div class="row" style="gap:8px;min-width:0">
        <span class="sym">$${esc(c.symbol || '???')}</span>
        <span class="name">${esc(c.name || '')}</span>
      </div>
      <span class="score ${scoreClass(c.score)}">${Math.round(c.score || 0)}</span>
    </div>
    ${c.alerted_at ? `<div style="font-size:11px;color:var(--muted);margin:2px 0 0">
      📣 chiamata alle <b style="color:var(--text)">${quando(c.alerted_at)}</b> · ${age(c.alerted_at)} fa
    </div>` : ''}
    <div class="metrics">
      <div class="metric"><small>Liq</small><b>${usd(c.liquidity_usd)}</b></div>
      <div class="metric"><small>MCap</small><b>${usd(c.market_cap)}</b></div>
      <div class="metric"><small>Vol 1h</small><b>${usd(c.volume_1h)}</b></div>
      <div class="metric"><small>Eta</small><b>${age(c.pair_created_at)}</b></div>
    </div>
    <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
      <div class="metric"><small>1h</small><b class="${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${chg.toFixed(0)}%</b></div>
      <div class="metric"><small>Buy/Sell 5m</small><b>${c.buys_5m || 0}/${c.sells_5m || 0}</b></div>
      <div class="metric"><small>${peak ? 'Picco' : 'Holder'}</small><b class="${peak >= 2 ? 'up' : ''}">${peak ? peak.toFixed(1) + 'x' : (c.holders || 0)}</b></div>
    </div>
    <div class="tags">${safetyTags(c)}</div>
    <div class="actions">
      <a href="https://dexscreener.com/robinhood/${c.token_address}" target="_blank" rel="noopener">📊 Chart</a>
      <a href="https://x.com/search?q=${c.token_address}&f=live" target="_blank" rel="noopener">🐦 X</a>
      <button onclick="copyCA('${c.token_address}')">📋 CA</button>
      <button onclick="watch('${c.token_address}', ${c.watchlisted ? 'false' : 'true'})">${c.watchlisted ? '★' : '☆'}</button>
    </div>
  </div>`;
}

function copyCA(address) {
  navigator.clipboard?.writeText(address).then(
    () => toast('Contract address copiato'),
    () => toast(address)
  );
}

async function watch(address, watched) {
  try {
    await api('/api/watchlist/' + address, {
      method: 'POST', body: JSON.stringify({ watched }),
    });
    toast(watched ? 'Aggiunto alla watchlist' : 'Rimosso');
    render();
  } catch (e) { toast(e.message); }
}

async function discoverWallets() {
  if (!confirm('Cerco le whales che erano presto sui token poi esplosi.\n\nCi vogliono alcuni minuti: il risultato arriva su Telegram.')) return;
  try {
    await api('/api/wallets/discover', { method: 'POST' });
    toast('Ricerca avviata, risultato su Telegram');
  } catch (e) { toast(e.message); }
}

// Le soglie si modificano dal telefono e valgono subito: il server che le
// ospita non e' raggiungibile, quindi questa e' l'unica via per regolarle.
async function saveTuning() {
  const payload = {};
  document.querySelectorAll('[data-tunable]').forEach((el) => {
    payload[el.dataset.tunable] = el.type === 'checkbox' ? el.checked : Number(el.value);
  });
  try {
    await api('/api/settings', { method: 'PUT', body: JSON.stringify(payload) });
    toast('Impostazioni salvate');
    render();
  } catch (e) { toast(e.message); }
}

// Doppia conferma perche' e' l'unico tasto che distrugge dati: la prima si
// puo' premere per sbaglio scorrendo, la seconda no.
async function wipeAll() {
  if (!confirm('Butto via TUTTI i token, gli alert, le statistiche e la lista delle whales.\n\nLe soglie di Setup restano come sono.\nTelegram non viene toccato: la cronologia la cancelli da li.\n\nProcedo?')) return;
  if (!confirm('Ultima conferma: i dati raccolti fin qui non tornano piu indietro.')) return;
  try {
    const r = await api('/api/wipe', { method: 'POST', body: JSON.stringify({ confirm: true }) });
    toast(`Pulito: ${r.candidati} token, ${r.alert} alert, ${r.wallet} whales`);
    alertFilter = null;
    render();
  } catch (e) { toast(e.message); }
}

async function resetSettings() {
  if (!confirm('Rimetto tutte le soglie ai valori di partenza?')) return;
  const payload = {};

}

const empty = (title, hint) => `<div class="empty"><b>${title}</b>${hint}</div>`;

// -- avvisi ----------------------------------------------------------------
// La pozza che si ritira e' l'unica cosa che chiede di fare qualcosa adesso
// invece di guardare un'occasione, e finora si vedeva solo su Telegram. Sta
// in una scheda sua: mescolarla agli alert sui candidati vorrebbe dire
// perdere la cosa urgente in mezzo a quelle da leggere con calma.
//
// Il pallino conta quelli arrivati dopo l'ultima apertura della scheda. Il
// segnaposto sta in localStorage e non sul server: e' una cosa di questo
// telefono, e il backup non deve portarsi dietro "cosa avevo gia' letto".
const visto = {
  get quando() { return Number(localStorage.getItem('avvisi_visti') || 0); },
  set quando(ts) { localStorage.setItem('avvisi_visti', String(ts)); },
};

let avvisi = [];

function pallino() {
  const nuovi = avvisi.filter((a) => a.ts > visto.quando).length;
  const nodo = document.getElementById('pallino');
  if (nodo) nodo.textContent = nuovi ? (nuovi > 9 ? '9+' : String(nuovi)) : '';
}

// `da` e' il momento dell'ultima apertura, passato da fuori invece di essere
// riletto qui: quando si apre la scheda il segnaposto si sposta subito, per
// spegnere il pallino, ma i nuovi devono restare evidenziati in questa
// passata - altrimenti si spegnerebbe tutto proprio mentre li si guarda.
// Deve dire le stesse identiche parole del messaggio Telegram (verdetto_pozza
// in notify.py): due testi diversi sullo stesso fatto si contraddicono.
//
// Il consiglio si decide su quanto e' RIMASTO, non su quanto e' sparito. Il
// giro di controllo passa ogni cinque minuti e togliere la liquidita' e' una
// transazione sola: la pozza va da piena a zero fra un passaggio e l'altro, e
// "se sei dentro esci" usciva solo quando uscire non era piu' possibile.
function verdettoPozza(sparita, rimasta) {
  if (rimasta < 1000) {
    return ['🪦', 'È finita: non c\'è più niente da vendere. Toglila dai salvati e non ricomprarla.', true];
  }
  if (sparita >= 85) {
    return ['🚨', 'Ne resta pochissima: se riesci a uscire fallo adesso, ma a questo punto potrebbe non bastare per tutti.', true];
  }
  if (sparita >= 50) {
    return ['🚨', 'Chi la sta togliendo se ne sta andando: se sei dentro, esci.', true];
  }
  if (sparita >= 20) {
    return ['⚠️', 'Il ritiro è cominciato sul serio. Se sei dentro, è il momento di chiudere: da qui in giù di solito non si torna indietro.', false];
  }
  return ['👀', 'Qualcuno ha cominciato a toglierla. Non è ancora un\'uscita di corsa, ma tienila d\'occhio.', false];
}

function avvisoCard(a, da) {
  const p = a.payload || {};
  const sparita = Math.round((p.sparita || 0) * 100);
  const [icona, cosaFare, grave] = verdettoPozza(sparita, Number(p.liquidita_dopo) || 0);
  const nuovo = a.ts > da;
  const simbolo = esc(p.symbol || a.symbol_candidato || a.token_address.slice(0, 10));
  return `
    <div class="card" style="border-left:3px solid var(--red)${nuovo ? ';background:rgba(255,92,92,.06)' : ''}">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <b>${icona} $${simbolo}</b>
        <span style="font-size:11px;color:var(--muted)">${quando(a.ts)} · ${age(a.ts)} fa</span>
      </div>
      ${a.alerted_at ? `<div style="font-size:11px;color:var(--muted);margin:2px 0 0">
        📣 chiamata alle <b style="color:var(--text)">${quando(a.alerted_at)}</b>
      </div>` : ''}
      <div style="margin:6px 0 8px">
        Sparito il <b class="down">${sparita}%</b> della liquidità
      </div>
      <div class="row" style="gap:10px;font-size:12px;color:var(--muted)">
        <span>💧 ${usd(p.liquidita_prima)} → <b>${usd(p.liquidita_dopo)}</b></span>
      </div>
      <div style="margin-top:8px;font-size:12px;color:${grave ? 'var(--red)' : 'var(--muted)'}">
        ${cosaFare}
      </div>
      <div class="actions">
        <a href="https://dexscreener.com/robinhood/${a.token_address}" target="_blank" rel="noopener">📊 Chart</a>
        <button onclick="copyCA('${a.token_address}')">📋 CA</button>
      </div>
    </div>`;
}

// I numeri per rispondere a "sta funzionando?". C'erano gia' tutti, ma
// sparsi: la domanda vera non e' quante notifiche sono partite, e' quante di
// quelle chiamate sono poi andate da qualche parte.
function andamento(p) {
  const chiamate = p.tracked_calls || 0;
  const quota = (n) => (chiamate ? Math.round((n / chiamate) * 100) : 0);
  const riga = (etichetta, valore, colore) => `
    <div class="row between" style="margin-top:8px">
      <span style="color:var(--muted);font-size:13px">${etichetta}</span>
      <b style="${colore ? 'color:' + colore : ''}">${valore}</b>
    </div>`;

  const scarti = (p.scarti_24h || []).slice(0, 5).map((s) => `
    <div class="row between" style="margin-top:5px;font-size:12px">
      <span style="color:var(--muted)">${esc(String(s.motivo).replace(/_/g, ' '))}</span>
      <span>${s.n}</span>
    </div>`).join('');

  return `
    <div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:2px">📊 Come sta andando</div>
      <div style="font-size:12px;color:var(--muted)">
        Su ${chiamate} chiamate di cui conosciamo il prezzo di partenza.
      </div>
      ${riga("Picco medio dopo l'alert", (p.avg_peak_multiple || 0).toFixed(2) + 'x',
             (p.avg_peak_multiple || 0) >= 1.5 ? 'var(--green)' : '')}
      ${riga('Hanno fatto 2x', `${p.hits_2x || 0} <span style="color:var(--muted);font-weight:400">(${quota(p.hits_2x || 0)}%)</span>`, 'var(--green)')}
      ${riga('Hanno fatto 5x', `${p.hits_5x || 0} <span style="color:var(--muted);font-weight:400">(${quota(p.hits_5x || 0)}%)</span>`, 'var(--green)')}
      ${riga('Hanno fatto 10x', `${p.hits_10x || 0}`, (p.hits_10x || 0) > 0 ? 'var(--green)' : '')}
      <div style="border-top:1px solid var(--border);margin:12px 0 8px"></div>
      ${riga('Token guardati in tutto', p.tokens_seen || 0)}
      ${riga('Notifiche mandate (24h)', p.alerts_24h || 0)}
      ${scarti ? `
        <div style="font-size:12px;color:var(--muted);margin-top:12px">
          PERCHE' NE HO SCARTATI ${p.rejected || 0} &mdash; quale filtro sta lavorando
        </div>${scarti}` : ''}
    </div>`;
}

function backupCard(b) {
  // La configurazione si scrive da qui e non nel file sul server, perche' al
  // server non ci si arriva: e' l'unico modo di accendere il backup senza
  // rifare la macchina da capo.
  const form = `
    <label>Repository di backup (privato)</label>
    <input id="bk-repo" value="${esc(b.repo || '')}" placeholder="tuonome/memescan-backup"
           data-bozza oninput="bozza.salva(this)"
           autocomplete="off" spellcheck="false" autocapitalize="off">
    <label>Token GitHub ${b.token_presente ? "· <b style=\"color:var(--green)\">gia salvato</b>, lascia vuoto per non cambiarlo" : ''}</label>
    <input id="bk-token" type="password" value="" placeholder="github_pat_..."
           data-bozza oninput="bozza.salva(this)" autocomplete="off">
    <button class="btn" onclick="salvaBackup()">Salva</button>`;

  if (!b.configurato) {
    return `
      <div class="card">
        <div style="font-size:15px;font-weight:700;margin-bottom:4px">💾 Backup</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5">
          Spento. Senza, se la macchina viene cancellata si perdono whales, storico
          e soglie. Un riavvio invece non fa danni: il disco resta.<br><br>
          Serve un repository <b style="color:var(--text)">privato e diverso</b> da
          quello del codice, e un token che possa scrivere solo li'.
        </div>
        ${form}
      </div>`;
  }
  const esito = b.esito === 'ok';
  return `
    <div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">💾 Backup</div>
      <div style="font-size:12px;color:var(--muted)">${esc(b.repo)}</div>
      <div class="row between" style="margin-top:8px">
        <span style="color:var(--muted);font-size:13px">Backup eseguito</span>
        <b style="color:${b.ultimo && esito ? 'var(--green)' : 'var(--muted)'}">
          ${b.ultimo ? age(b.ultimo) + ' fa' : 'mai'}${b.ultimo && !esito ? ' ⚠️' : ''}
        </b>
      </div>
      ${b.ripristino ? `
      <div class="row between" style="margin-top:6px">
        <span style="color:var(--muted);font-size:13px">Ripristinato</span>
        <b style="color:var(--green)">${age(b.ripristino)} fa</b>
      </div>` : ''}
      ${esito ? '' : `<div class="tag bad" style="margin-top:8px;display:inline-block">${esc(b.esito || 'non riuscito')}</div>`}
      <div style="font-size:12px;color:var(--muted);margin-top:10px">
        Automatico ogni notte. Questi servono solo se ti serve adesso.
      </div>
      <button class="btn ghost" onclick="backupAdesso()">⬆️ Esegui backup</button>
      <button class="btn ghost" onclick="ripristina()">⬇️ Ripristina backup</button>
      <details style="margin-top:12px">
        <summary style="font-size:12px;color:var(--muted);cursor:pointer">Cambia repository o token</summary>
        ${form}
      </details>
    </div>`;
}

async function salvaBackup() {
  const repo = document.getElementById('bk-repo').value.trim();
  const token = document.getElementById('bk-token').value.trim();
  if (!repo) return toast('Manca il repository');
  try {
    const r = await api('/api/backup/config', {
      method: 'PUT', body: JSON.stringify({ repo, token }),
    });
    bozza.pulisci('bk-repo', 'bk-token');
    toast(r.configurato ? 'Backup acceso' : 'Salvato, manca ancora il token');
    render();
  } catch (e) { toast(e.message); }
}

async function backupAdesso() {
  toast('Copia in corso...');
  try {
    await api('/api/backup', { method: 'POST' });
    toast('Backup fatto');
    render();
  } catch (e) { toast(e.message); }
}

// Sovrascrive tutto quello che c'e' adesso, quindi due conferme come per la
// pulizia. La prima si puo' premere per sbaglio scorrendo, la seconda no.
async function ripristina() {
  if (!confirm('Scarico l\'ultimo backup da GitHub e lo rimetto al posto di quello che c\'e\' adesso.\n\nToken, alert, whales e soglie tornano a com\'erano al momento della copia.\n\nProcedo?')) return;
  if (!confirm('Ultima conferma: quello che c\'e\' adesso viene sostituito.')) return;
  toast('Ripristino in corso...');
  try {
    const r = await api('/api/restore', { method: 'POST', body: JSON.stringify({ confirm: true }) });
    // Dire di che momento era la copia e' il punto: senza, non si sa a
    // quando si e' tornati e la dashboard sembra aver perso la memoria.
    const quando = r.fatto_il
      ? new Date(r.fatto_il * 1000).toLocaleString('it-IT',
          { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      : '';
    toast(`Rimesso il backup${quando ? ' del ' + quando : ''}: ${r.candidati} token, ${r.whales} whales`);
    alertFilter = null;
    render();
  } catch (e) { toast(e.message); }
}

async function render() {
  const view = document.getElementById('view');
  try {
    if (tab === 'live') {
      const [rows, waiting] = await Promise.all([
        api('/api/recent?limit=60'),
        api('/api/pending?limit=25').catch(() => []),
      ]);
      // I pool appena creati non hanno ancora prezzo ne' volume: mostrarli come
      // schede piene di zeri sarebbe solo rumore, ma sono i piu' giovani in
      // assoluto e vale la pena tenerli sott'occhio in forma compatta.
      const waitingRows = waiting.map((p) => `
        <div class="card" style="padding:9px 12px">
          <div class="row between">
            <span><b>$${esc(p.symbol || '???')}</b> <span class="tag">in attesa di dati</span></span>
            <span style="font-size:11px;color:var(--muted)">${age(p.pair_created_at)}</span>
          </div>
        </div>`).join('');
      view.innerHTML = (rows.length
        ? rows.map(card).join('')
        : empty('Nessun candidato', 'Lo scanner sta girando: i token compaiono qui appena superano i filtri.'))
        + (waitingRows
          ? `<div style="color:var(--muted);font-size:12px;margin:14px 4px 2px">APPENA CREATI · ${waiting.length}</div>` + waitingRows
          : '');
    } else if (tab === 'alerts') {
      const rows = await api('/api/candidates?status=alerted&limit=60');
      // Le tre caselle sono esclusive: ogni token sta in una sola e i tre
      // numeri fanno il totale. Con i filtri che si sovrapponevano, "Whales 33"
      // su 33 alert sembrava dire che erano tutte whales.
      const conta = (f) => rows.filter((c) => kindOf(c) === f).length;
      const caselle = ['scanner', 'scanner_whales', 'whales'];
      if (!alertFilter) {
        alertFilter = caselle.reduce((a, b) => (conta(b) > conta(a) ? b : a), 'scanner_whales');
      }
      const shown = rows.filter((c) => kindOf(c) === alertFilter);
      const bar = caselle.map((f) => `
        <button class="${alertFilter === f ? 'on' : ''}" onclick="setAlertFilter('${f}')">
          ${KINDS[f].short} ${conta(f)}
        </button>`).join('');
      // Gli scaduti non hanno un pulsante ma non spariscono di nascosto: si
      // vedono solo se li si chiede, perche' non sono roba da comprare.
      const scaduti = conta('scaduto');
      const riga = scaduti && alertFilter !== 'scaduto'
        ? `<div style="text-align:center;font-size:12px;color:var(--muted);margin:4px 0">
             <a href="#" onclick="setAlertFilter('scaduto');return false" style="color:var(--muted)">
               🕓 ${scaduti} scaduti — le whales sono uscite e da soli non reggono
             </a></div>`
        : alertFilter === 'scaduto'
          ? `<div style="text-align:center;font-size:12px;margin:4px 0">
               <a href="#" onclick="setAlertFilter(null);return false" style="color:var(--muted)">
                 ← torna agli alert validi</a></div>`
          : '';
      view.innerHTML = `<div class="filters">${bar}</div>${riga}` + (shown.length
        ? shown.map(card).join('')
        : empty(...KINDS[alertFilter].vuoto));
    } else if (tab === 'notifiche') {
      avvisi = await api('/api/notifiche?limit=60');
      const da = visto.quando;
      view.innerHTML = avvisi.length
        ? avvisi.map((a) => avvisoCard(a, da)).join('')
        : empty('Nessun avviso',
                'Qui arriva un avviso quando qualcuno toglie la liquidita\' da un token che ti ho segnalato. Se e\' vuota, nessuno l\'ha fatto.');
      // Letti: il pallino si spegne subito, le schede restano evidenziate.
      if (avvisi.length) visto.quando = avvisi[0].ts;
      pallino();
    } else if (tab === 'saved') {
      const rows = await api('/api/watchlist');
      view.innerHTML = rows.length
        ? rows.map(card).join('')
        : empty('Nessun token salvato',
                'Tocca la ☆ su una scheda per tenerla da parte: la ritrovi qui, con il prezzo aggiornato e il picco raggiunto.');
    } else if (tab === 'wallets') {
      const data = await api('/api/wallets');

        <div class="card">

      view.innerHTML = `

    } else {
      const [health, tuning, perf, bkp] = await Promise.all([

      view.innerHTML = `
        ${perf ? andamento(perf) : ''}
        ${bkp ? backupCard(bkp) : ''}
        ${tuning.length ? `
        <div class="card">
          <div style="font-size:15px;font-weight:700;margin-bottom:4px">Filtri e soglie</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">
            Valgono subito, senza riavviare niente.

          ${tuning.map(tunableRow).join('')}
          <button class="btn" onclick="saveTuning()">Salva impostazioni</button>

        </div>` : ''}
        <div class="card">
          <label>Indirizzo del backend</label>
          <input id="base-input" value="${esc(store.base)}" placeholder="http://192.168.1.10:8080"
           data-bozza oninput="bozza.salva(this)" autocomplete="off" spellcheck="false">
          <label>Token API (se impostato sul server)</label>
          <input id="token-input" type="password" value="${esc(store.token)}" autocomplete="off">

          <div class="row between" style="margin-top:8px"><span>Scansioni</span><b>${health.scans ?? 0}</b></div>
          <div class="row between" style="margin-top:8px"><span>Errori</span><b>${health.errors ?? 0}</b></div>
          <div class="row between" style="margin-top:8px"><span>Whales tracciate</span><b>${health.tracked_wallets ?? 0}</b></div>
          ${(health.missing_config || []).length
            ? `<div class="tag warn" style="margin-top:10px;display:inline-block">Manca: ${esc((health.missing_config || []).join(', '))}</div>`
            : ''}
        </div>
        <div class="card" style="border-color:rgba(255,92,92,.3);margin-top:22px">
          <div style="font-size:15px;font-weight:700;color:var(--red);margin-bottom:4px">🧹 Pulisci e ricomincia</div>
          <div style="font-size:12px;color:var(--muted);line-height:1.5">
            Butta via token, alert, statistiche e la lista delle whales, e riparte
            da adesso.<br><br>
            <b style="color:var(--text)">Le soglie qui sopra restano come le hai messe</b>
            &mdash; per quelle c'e' il tasto «Ripristina i valori di partenza».<br>
            Telegram non viene toccato: la cronologia la cancelli tu da li.
          </div>
          <button class="btn" style="background:var(--red);color:#2a0606" onclick="wipeAll()">Pulisci tutto</button>
        </div>`;
    }
  } catch (e) {
    view.innerHTML = empty('Backend non raggiungibile', esc(e.message) + '<br><br>Controlla l\'indirizzo nella scheda Setup.');
  }
  bozza.ripristina();
}

async function refreshStats() {
  try {
    const [s, h] = await Promise.all([api('/api/stats'), api('/api/health')]);
    document.getElementById('health-dot').classList.toggle('on', !!h.chain_ok);
    document.getElementById('stats').innerHTML = `
      <span>visti <b>${s.tokens_seen}</b></span>
      <span>alert 24h <b>${s.alerts_24h}</b></span>
      <span>picco medio <b>${s.avg_peak_multiple}x</b></span>
      <span>2x <b>${s.hits_2x}</b></span>
      <span>5x <b>${s.hits_5x}</b></span>`;
  } catch {
    document.getElementById('health-dot').classList.remove('on');
    document.getElementById('stats').innerHTML = '<span>backend offline</span>';
  }
}

// Il pallino deve accendersi anche stando su un'altra scheda, altrimenti
// l'unico modo di scoprire che stanno svuotando una pozza sarebbe passare da
// Avvisi a caso. Quando la scheda aperta e' gia' quella, ci pensa render().
async function refreshAvvisi() {
  if (tab === 'notifiche') return;
  try {
    avvisi = await api('/api/notifiche?limit=60');
    pallino();
  } catch { /* il backend offline lo dice gia' il pallino in alto */ }
}

function refresh() { render(); refreshStats(); refreshAvvisi(); }

// L'aggiornamento automatico riscrive la pagina, e con lei quello che si sta
// scrivendo dentro una casella. Succede a ogni ritorno nell'app, cioe' proprio
// quando si torna da un'altra applicazione con qualcosa negli appunti.
function aggiornamentoAutomatico() {
  // Setup non ha niente che cambi da solo: aggiornarlo puo' solo dare
  // fastidio. Il tasto ⟳ in alto continua a funzionare.
  //
  // Il pallino degli avvisi va aggiornato anche qui: tocca solo l'icona in
  // basso, non la pagina che si sta guardando ne' la casella che si sta
  // riempiendo, e la pozza che si svuota non aspetta che si esca da Setup.
  if (tab === 'settings') { refreshAvvisi(); return refreshStats(); }
  // Altrove basta non toccare niente mentre si sta scrivendo.
  const attivo = document.activeElement;
  if (attivo && attivo.tagName === 'INPUT') { refreshAvvisi(); return refreshStats(); }
  refresh();
}

document.querySelectorAll('nav button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    tab = btn.dataset.tab;
    render();
  });
});
document.getElementById('refresh').addEventListener('click', refresh);

refresh();
// La dashboard e' un client sottile: il polling ravvicinato non pesa sul backend
// perche' legge solo da SQLite, ma si ferma quando l'app va in background.
timer = setInterval(aggiornamentoAutomatico, 15000);
document.addEventListener('visibilitychange', () => {
  clearInterval(timer);
  if (!document.hidden) {
    aggiornamentoAutomatico();
    timer = setInterval(aggiornamentoAutomatico, 15000);
  }
});
</script>
</body>
</html>
