<title>Registro Cimiteriale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Pagina di ricerca centrata stile motore di ricerca; schede del defunto con le sezioni del registro cartaceo */
  :root {
    --bg: #ffffff; --fg: #202124; --muted: #5f6368; --line: #dadce0; --line-strong: #c9c2b8;
    --surface: #ffffff; --hover: #f1f3f4; --soft: #fbeff1; --chip: #f6f4f4;
    --accent: #7a2e3a; --accent-ink: #ffffff; --danger: #a40000; --danger-line: #e0b4b4;
    --shadow: 0 1px 6px rgba(32,33,36,.28); --scrim: rgba(0,0,0,.45);
    --toast-bg: #222222; --toast-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #17181a; --fg: #e8e6e3; --muted: #a3a6ab; --line: #3a3c40; --line-strong: #4a4c50;
    --surface: #202124; --hover: #2b2c30; --soft: #33222a; --chip: #2a2b2f;
    --accent: #d98a99; --accent-ink: #1b0f12; --danger: #ff8a8a; --danger-line: #6b3434;
    --shadow: 0 1px 8px rgba(0,0,0,.6); --scrim: rgba(0,0,0,.65);
    --toast-bg: #e8e6e3; --toast-fg: #17181a; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #17181a; --fg: #e8e6e3; --muted: #a3a6ab; --line: #3a3c40; --line-strong: #4a4c50;
    --surface: #202124; --hover: #2b2c30; --soft: #33222a; --chip: #2a2b2f;
    --accent: #d98a99; --accent-ink: #1b0f12; --danger: #ff8a8a; --danger-line: #6b3434;
    --shadow: 0 1px 8px rgba(0,0,0,.6); --scrim: rgba(0,0,0,.65);
    --toast-bg: #e8e6e3; --toast-fg: #17181a; color-scheme: dark }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; background: var(--bg); color: var(--fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; color: var(--fg); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger-line); }

  /* Barra superiore */
  .topbar { position: relative; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-block: 14px; }
  .menu-list { position: absolute; right: 0; top: 62px; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 220px; z-index: 20; padding: 6px 0; }
  .menu-list button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 10px 16px; background: transparent; }
  .menu-list button:hover { background: var(--hover); }
  .menu-list .info { padding: 6px 16px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: 4px; }

  /* Pagina iniziale */
  .home { display: flex; flex-direction: column; align-items: center; transition: padding .2s; }
  .home.centered { padding-top: 16vh; }
  .logo { font-size: 2.6rem; font-weight: 300; color: var(--accent); letter-spacing: .04em; margin: 0 0 6px; text-align: center; text-wrap: balance; }
  .logo b { font-weight: 700; }
  .tagline { color: var(--muted); margin: 0 0 26px; font-size: .95rem; text-align: center; }
  .home:not(.centered) .logo { font-size: 1.6rem; }
  .home:not(.centered) .tagline { display: none; }
  .status { margin-top: 18px; color: var(--muted); font-size: .88rem; text-align: center; }

  .searchbox { position: relative; width: 100%; max-width: 620px; }
  .searchbar { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 26px; padding: 0 16px; height: 50px; background: var(--surface); }
  .searchbar:hover, .searchbar:focus-within { box-shadow: var(--shadow); border-color: transparent; }
  .searchbar.open { border-radius: 24px 24px 0 0; box-shadow: var(--shadow); border-color: transparent; }
  .searchbar svg { flex: none; color: var(--muted); }
  .searchbar input { flex: 1; border: 0; outline: 0; font-size: 1.05rem; background: transparent; min-width: 0; color: var(--fg); }
  .searchbar .x { border: 0; background: none; padding: 4px 6px; color: var(--muted); font-size: 1.3rem; line-height: 1; }
  .suggest { position: absolute; left: 0; right: 0; top: 50px; background: var(--surface); border-radius: 0 0 24px 24px; box-shadow: var(--shadow); padding: 4px 0 12px; z-index: 10; border-top: 1px solid var(--line); }
  .suggest div { padding: 9px 20px 9px 48px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .suggest div.sel, .suggest div:hover { background: var(--hover); }
  .suggest small { color: var(--muted); white-space: nowrap; }

  /* Risultati */
  .results { max-width: 900px; margin: 24px auto 40px; }
  .count { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
  .scheda { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden; background: var(--surface); }
  .scheda-head { background: var(--soft); padding: 12px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
  .scheda-head h3 { margin: 0; font-size: 1.25rem; color: var(--accent); }
  .scheda-head .meta { color: var(--muted); font-size: .88rem; }
  .scheda-body { display: grid; grid-template-columns: 1fr 1fr; }
  .blk { padding: 12px 16px; border-top: 1px solid var(--line); min-width: 0; }
  .blk:nth-child(odd) { border-right: 1px solid var(--line); }
  @media (max-width: 700px) { .scheda-body { grid-template-columns: 1fr; } .blk:nth-child(odd) { border-right: 0; } }
  .blk h4 { margin: 0 0 8px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .row { display: flex; gap: 8px; font-size: .95rem; margin-bottom: 4px; }
  .row span { color: var(--muted); min-width: 120px; }
  .row b { min-width: 0; overflow-wrap: anywhere; }
  .dmy { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-variant-numeric: tabular-nums; }
  .dmy div { padding: 4px; }
  .dmy .h { background: var(--chip); font-size: .7rem; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .scheda-foot { border-top: 1px solid var(--line); padding: 8px 16px; text-align: right; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }

  /* Modulo e finestre */
  .overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    overflow-y: auto; z-index: 50; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 1100px; padding: 20px; box-shadow: var(--shadow); }
  .modal.small { max-width: 440px; margin-top: 18vh; }
  .modal.small p { margin: 0 0 16px; line-height: 1.45; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .modal-head h2 { margin: 0; color: var(--accent); font-size: 1.25rem; }
  .modal-head .close { border: 0; font-size: 1.6rem; line-height: 1; padding: 2px 8px; background: none; }
  fieldset { border: 1px solid var(--line-strong); border-radius: 6px; margin: 0 0 12px; padding: 10px 12px 4px; min-width: 0; }
  legend { font-weight: 700; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); padding: 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 1fr)); gap: 0 14px; }
  .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .cols-2 > div { min-width: 0; }
  @media (max-width: 800px) { .cols-2 { grid-template-columns: 1fr; } }
  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
  .field { display: flex; gap: 4px; margin-top: 3px; }
  .field input, .field textarea { width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--line-strong); border-radius: 5px; font: inherit; color: var(--fg); background: var(--bg); }
  .field textarea { min-height: 38px; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .actions .left { margin-right: auto; }

  #toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-fg); padding: 10px 18px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100; max-width: calc(100% - 32px); }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .home, #toast { transition: none; } }
</style>

<div class="topbar">
  <button id="btn-menu" title="Altre funzioni" aria-haspopup="true">☰</button>
  <div class="menu-list" id="menu-list" hidden>
    <button id="btn-csv">Esporta in Excel</button>
    <button id="btn-backup">Salva copia di sicurezza</button>
    <button id="btn-restore">Ripristina copia di sicurezza</button>
    <div class="info" id="db-info"></div>
  </div>
  <input type="file" id="file-restore" accept=".json" hidden>
  <button class="primary" id="btn-add" disabled>+ Aggiungi defunto</button>
</div>

<div class="home centered" id="home">
  <h1 class="logo">Registro <b>Cimiteriale</b></h1>
  <p class="tagline">Scrivi nome e cognome del defunto</p>
  <div class="searchbox">
    <form class="searchbar" id="searchbar" autocomplete="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Es. Rossi Mario" aria-label="Cerca defunto">
      <button type="button" class="x" id="q-clear" title="Cancella" hidden>×</button>
    </form>
    <div class="suggest" id="suggest" hidden></div>
  </div>
  <div class="status" id="status">Caricamento dell'archivio…</div>
</div>

<div class="results" id="results" hidden></div>

<!-- Modulo Aggiungi defunto -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title">
    <div class="modal-head">
      <h2 id="form-title">Aggiungi defunto</h2>
      <button type="button" class="close" id="btn-close" title="Chiudi">×</button>
    </div>
    <form id="form" autocomplete="off">
      <input type="hidden" name="id" id="f-id">
      <div class="cols-2">
        <div>
          <fieldset>
            <legend>Defunto</legend>
            <div class="grid">
              <label>Num. d'ord. <em>(automatico)</em>
                <div class="field"><input name="num" id="f-num" type="number" min="1" required></div></label>
            </div>
            <div class="grid">
              <label>Cognome
                <div class="field"><input name="cognome" id="f-cognome" required data-upper></div></label>
              <label>Nome
                <div class="field"><input name="nome" id="f-nome" required data-upper></div></label>
              <label>Nato/a a
                <div class="field"><input name="natoA" id="f-natoA"></div></label>
              <label>il (data di nascita)
                <div class="field"><input name="natoIl" id="f-natoIl" type="date"></div></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Data e luogo di morte</legend>
            <div class="grid">
              <label>Data
                <div class="field"><input name="morteData" id="f-morteData" type="date"></div></label>
              <label>Luogo
                <div class="field"><input name="morteLuogo" id="f-morteLuogo"></div></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Data della tumulazione</legend>
            <div class="grid">
              <label>Data (anno, giorno, mese)
                <div class="field"><input name="tumData" id="f-tumData" type="date"></div></label>
              <label>Ora
                <div class="field"><input name="tumOra" id="f-tumOra" type="time"></div></label>
            </div>
          </fieldset>
        </div>
        <div>
          <fieldset>
            <legend>Permesso di seppellimento</legend>
            <div class="grid">
              <label>Numero
                <div class="field"><input name="permNumero" id="f-permNumero"></div></label>
              <label>Data
                <div class="field"><input name="permData" id="f-permData" type="date"></div></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Luogo di tumulazione</legend>
            <div class="grid">
              <label>Zona
                <div class="field"><input name="zona" id="f-zona" list="dl-zona"></div></label>
              <label>Loculo
                <div class="field"><input name="loculo" id="f-loculo"></div></label>
              <label>Tomba di famiglia
                <div class="field"><input name="tomba" id="f-tomba" list="dl-tomba"></div></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Estumulazione</legend>
            <div class="grid">
              <label>Data (anno, giorno, mese)
                <div class="field"><input name="estData" id="f-estData" type="date"></div></label>
              <label>Ora
                <div class="field"><input name="estOra" id="f-estOra" type="time"></div></label>
            </div>
            <label>Destinazione dei resti mortali
              <div class="field"><textarea name="estDestinazione" id="f-estDestinazione"></textarea></div></label>
          </fieldset>
          <fieldset>
            <legend>Note</legend>
            <label>Annotazioni
              <div class="field"><textarea name="note" id="f-note"></textarea></div></label>
          </fieldset>
        </div>
      </div>
      <datalist id="dl-zona"></datalist>
      <datalist id="dl-tomba"></datalist>
      <div class="actions">
        <button type="button" class="danger left" id="btn-delete" hidden>Elimina</button>
        <button type="button" id="btn-cancel">Annulla</button>
        <button type="submit" class="primary" id="btn-save">Salva</button>
      </div>
    </form>
  </div>
</div>

<!-- Finestra di conferma -->
<div class="overlay" id="ask" hidden>
  <div class="modal small" role="alertdialog" aria-modal="true">
    <p id="ask-text"></p>
    <div class="actions">
      <button type="button" id="ask-no">Annulla</button>
      <button type="button" class="primary" id="ask-yes">Conferma</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(function () {
  const COLL = 'defunti';
  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const F = (n) => form.elements[n];

  let db = null, records = [], loaded = false, readOnly = false;

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000);
  }
  function ask(text, yesLabel) {
    return new Promise((resolve) => {
      $('ask-text').textContent = text;
      $('ask-yes').textContent = yesLabel || 'Conferma';
      $('ask').hidden = false; $('ask-yes').focus();
      const done = (v) => { $('ask').hidden = true; $('ask-yes').onclick = $('ask-no').onclick = null; resolve(v); };
      $('ask-yes').onclick = () => done(true);
      $('ask-no').onclick = () => done(false);
    });
  }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const itDate = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
  const parts = (iso) => { if (!iso) return ['', '', '']; const [y, m, d] = iso.split('-'); return [y, d, m]; };
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const nextNum = () => records.reduce((m, r) => Math.max(m, +r.num || 0), 0) + 1;
  const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const FIELDS = ['num','cognome','nome','natoA','natoIl','morteData','morteLuogo','tumData','tumOra','permNumero','permData','zona','loculo','tomba','estData','estOra','estDestinazione','note','creato','modificato'];

  function setStatus(msg) { const s = $('status'); s.textContent = msg || ''; s.hidden = !msg; }
  function updateInfo() { $('db-info').textContent = loaded ? `Defunti registrati: ${records.length}` : 'Archivio non ancora caricato'; }

  // ---------- Archivio (database dell'artifact) ----------
  async function connect() {
    try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) { setStatus("Archivio non disponibile. Apri il registro dal link di Claude, dopo aver effettuato l'accesso."); return; }
    const timer = setTimeout(() => { if (!loaded) setStatus("L'archivio non risponde ancora. Controlla la connessione internet."); }, 10000);
    db.collection(COLL).onSnapshot((snap) => {
      records = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); }
      if (loaded || records.length) {
        setStatus(records.length ? '' : 'Archivio vuoto: premi «Aggiungi defunto» per registrare il primo.');
        $('btn-add').disabled = readOnly;
      }
      updateInfo();
      if (!$('results').hidden && lastQuery !== null) refreshResults();
    }, (err) => {
      clearTimeout(timer);
      setStatus(err.code === 'revoked' ? 'Accesso all\'archivio non più disponibile.' : 'Impossibile leggere l\'archivio. Ricarica la pagina più tardi.');
    });
  }

  async function writeDoc(id, data) {
    try { await db.collection(COLL).doc(id).set(data); return true; }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise(r => setTimeout(r, 800 + Math.random() * 800));
        try { await db.collection(COLL).doc(id).set(data); return true; } catch (e2) { e = e2; }
      }
      if (e && e.code === 'invalid_argument') { readOnly = true; $('btn-add').disabled = true; toast('Non hai il permesso di modificare questo registro.'); }
      else if (e && e.code === 'quota_exceeded') toast('Archivio pieno: non è possibile aggiungere altri defunti.');
      else toast('Salvataggio non riuscito. Controlla la connessione e riprova.');
      return false;
    }
  }

  // ---------- Ricerca ----------
  function search(q) {
    const words = norm(q).split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    return records.filter(r => {
      const hay = norm(`${r.cognome} ${r.nome} ${r.num}`);
      return words.every(w => hay.includes(w));
    }).sort((a, b) => (a.cognome + ' ' + a.nome).localeCompare(b.cognome + ' ' + b.nome) || a.num - b.num);
  }

  const qInput = $('q'), sugg = $('suggest'), bar = $('searchbar');
  let selIdx = -1, suggList = [], lastQuery = null, lastIds = null;

  function showSuggest() {
    const v = qInput.value;
    $('q-clear').hidden = !v;
    suggList = search(v).slice(0, 8); selIdx = -1;
    if (!v.trim() || !suggList.length) { hideSuggest(); return; }
    sugg.innerHTML = suggList.map((r, i) =>
      `<div data-i="${i}">${esc(r.cognome)} ${esc(r.nome)}<small>${r.morteData ? '† ' + itDate(r.morteData) : 'n. ' + esc(r.num)}</small></div>`).join('');
    sugg.hidden = false; bar.classList.add('open');
  }
  function hideSuggest() { sugg.hidden = true; bar.classList.remove('open'); }
  function pick(r) { qInput.value = `${r.cognome} ${r.nome}`; hideSuggest(); showResults([r], true); }

  qInput.addEventListener('input', showSuggest);
  qInput.addEventListener('focus', showSuggest);
  qInput.addEventListener('keydown', (e) => {
    if (sugg.hidden) return;
    const items = sugg.querySelectorAll('div');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      selIdx = (selIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((d, i) => d.classList.toggle('sel', i === selIdx));
    } else if (e.key === 'Escape') hideSuggest();
  });
  sugg.addEventListener('mousedown', (e) => {
    const d = e.target.closest('[data-i]'); if (!d) return;
    e.preventDefault(); pick(suggList[+d.dataset.i]);
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.searchbox')) hideSuggest(); });
  bar.addEventListener('submit', (e) => {
    e.preventDefault();
    if (selIdx >= 0 && suggList[selIdx]) { pick(suggList[selIdx]); return; }
    hideSuggest();
    if (!qInput.value.trim()) { goHome(); return; }
    showResults(search(qInput.value), false);
  });
  $('q-clear').addEventListener('click', () => { qInput.value = ''; goHome(); qInput.focus(); });

  function goHome() { lastQuery = null; lastIds = null; $('home').classList.add('centered'); $('results').hidden = true; $('q-clear').hidden = !qInput.value; hideSuggest(); }

  function showResults(list, exact) {
    lastQuery = qInput.value; lastIds = exact ? list.map(r => r.id) : null;
    $('q-clear').hidden = !qInput.value;
    $('home').classList.remove('centered');
    const res = $('results'); res.hidden = false;
    if (!list.length) {
      res.innerHTML = `<div class="empty">Nessun defunto trovato per «${esc(qInput.value)}».<br><br>
        ${readOnly ? '' : '<button class="primary" id="add-from-empty">+ Aggiungi defunto</button>'}</div>`;
      const b = $('add-from-empty'); if (b) b.onclick = () => openForm(null, qInput.value);
      return;
    }
    res.innerHTML = `<div class="count">${list.length === 1 ? '1 risultato' : list.length + ' risultati'}</div>` + list.map(scheda).join('');
  }
  function refreshResults() {
    const list = lastIds ? records.filter(r => lastIds.includes(r.id)) : search(lastQuery);
    showResults(list, !!lastIds);
  }
  $('results').addEventListener('click', (e) => {
    const b = e.target.closest('[data-edit]'); if (!b) return;
    const r = records.find(x => x.id === b.dataset.edit); if (r) openForm(r);
  });

  function dmy(iso, ora) {
    const [y, d, m] = parts(iso);
    return `<div class="dmy"><div class="h">Anno</div><div class="h">Giorno</div><div class="h">Mese</div><div class="h">Ora</div>
      <div>${y || '—'}</div><div>${d || '—'}</div><div>${m || '—'}</div><div>${esc(ora) || '—'}</div></div>`;
  }
  const row = (k, v) => `<div class="row"><span>${k}</span><b>${esc(v) || '—'}</b></div>`;

  function scheda(r) {
    const hasEst = r.estData || r.estOra || r.estDestinazione;
    return `<article class="scheda">
      <div class="scheda-head">
        <h3>${esc(r.cognome)} ${esc(r.nome)}</h3>
        <div class="meta">Num. d'ord. <b>${esc(r.num)}</b></div>
      </div>
      <div class="scheda-body">
        <div class="blk"><h4>Defunto</h4>${row('Nato/a a', r.natoA)}${row('il', itDate(r.natoIl))}</div>
        <div class="blk"><h4>Data e luogo di morte</h4>${row('Data', itDate(r.morteData))}${row('Luogo', r.morteLuogo)}</div>
        <div class="blk"><h4>Data della tumulazione</h4>${dmy(r.tumData, r.tumOra)}</div>
        <div class="blk"><h4>Permesso di seppellimento</h4>${row('Numero', r.permNumero)}${row('Data', itDate(r.permData))}</div>
        <div class="blk"><h4>Luogo di tumulazione</h4>${row('Zona', r.zona)}${row('Loculo', r.loculo)}${row('Tomba di famiglia', r.tomba)}</div>
        <div class="blk"><h4>Estumulazione</h4>${hasEst ? dmy(r.estData, r.estOra) + '<div style="margin-top:8px">' + row('Destinazione dei resti mortali', r.estDestinazione) + '</div>' : '<div class="row"><b>—</b></div>'}</div>
        ${r.note ? `<div class="blk" style="grid-column:1/-1;border-right:0"><h4>Note</h4>${esc(r.note)}</div>` : ''}
      </div>
      ${readOnly ? '' : `<div class="scheda-foot"><button data-edit="${esc(r.id)}">Modifica</button></div>`}
    </article>`;
  }

  // ---------- Modulo Aggiungi / Modifica ----------
  function openForm(r, prefill) {
    form.reset();
    if (r) {
      for (const el of form.elements) if (el.name && el.name in r) el.value = r[el.name] ?? '';
      F('id').value = r.id;
      $('form-title').textContent = `Modifica — ${r.cognome} ${r.nome}`;
      $('btn-delete').hidden = false;
    } else {
      F('id').value = '';
      F('num').value = nextNum();
      if (prefill) {
        const w = prefill.trim().toUpperCase().split(/\s+/);
        F('cognome').value = w[0] || ''; F('nome').value = w.slice(1).join(' ');
      }
      $('form-title').textContent = 'Aggiungi defunto';
      $('btn-delete').hidden = true;
    }
    const uniq = (k) => [...new Set(records.map(x => x[k]).filter(Boolean))].sort();
    $('dl-zona').innerHTML = uniq('zona').map(v => `<option value="${esc(v)}">`).join('');
    $('dl-tomba').innerHTML = uniq('tomba').map(v => `<option value="${esc(v)}">`).join('');
    $('overlay').hidden = false;
    $('overlay').scrollTop = 0;
    setTimeout(() => F('cognome').focus(), 50);
  }
  function closeForm() { $('overlay').hidden = true; }

  $('btn-add').addEventListener('click', () => openForm(null));
  $('btn-close').addEventListener('click', closeForm);
  $('btn-cancel').addEventListener('click', closeForm);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('overlay').hidden && $('ask').hidden) closeForm(); });
  form.querySelectorAll('[data-upper]').forEach(i => i.addEventListener('blur', () => { i.value = i.value.trim().toUpperCase(); }));

  let saving = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (saving || !db) return;
    const data = {};
    for (const el of form.elements) if (el.name) data[el.name] = el.value.trim();
    const id = data.id || newId(); delete data.id;
    data.cognome = data.cognome.toUpperCase();
    data.nome = data.nome.toUpperCase();
    data.num = +data.num;
    const dup = records.find(r => r.num === data.num && r.id !== id);
    if (dup && !(await ask(`Il numero d'ordine ${data.num} è già usato da ${dup.cognome} ${dup.nome}. Salvare comunque?`, 'Salva comunque'))) return;
    const old = records.find(r => r.id === id);
    if (old) { data.creato = old.creato || ''; data.modificato = new Date().toISOString(); }
    else data.creato = new Date().toISOString();
    saving = true; $('btn-save').disabled = true;
    const ok = await writeDoc(id, data);
    saving = false; $('btn-save').disabled = false;
    if (!ok) return;
    toast(old ? 'Modifiche salvate' : `Registrato n. ${data.num}: ${data.cognome} ${data.nome}`);
    closeForm();
    qInput.value = `${data.cognome} ${data.nome}`;
    const saved = { ...data, id };
    if (!records.some(r => r.id === id)) records.push(saved);
    showResults([records.find(r => r.id === id) || saved], true);
  });

  $('btn-delete').addEventListener('click', async () => {
    const id = F('id').value; const r = records.find(x => x.id === id);
    if (!r || !(await ask(`Eliminare definitivamente ${r.cognome} ${r.nome} (n. ${r.num})?`, 'Elimina'))) return;
    try { await db.collection(COLL).doc(id).delete(); }
    catch (e) { toast('Eliminazione non riuscita. Riprova.'); return; }
    closeForm(); toast('Registrazione eliminata');
    qInput.value = ''; goHome();
  });

  // ---------- Menu: Excel / copia di sicurezza ----------
  const menu = $('menu-list');
  $('btn-menu').addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
  document.addEventListener('click', (e) => { if (!e.target.closest('#menu-list') && e.target.id !== 'btn-menu') menu.hidden = true; });

  async function saveFile(filename, data) {
    let dl = null;
    try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (!dl) { toast('Il salvataggio di file non è disponibile qui.'); return; }
    try { const r = await dl.save({ filename, data }); if (r && r.status === 'saved') toast('File salvato'); }
    catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') toast('File non salvato.'); }
  }
  const stamp = () => new Date().toISOString().slice(0, 10);
  const sorted = () => records.slice().sort((a, b) => a.num - b.num);

  $('btn-csv').addEventListener('click', () => {
    menu.hidden = true;
    const head = ["Num. d'ord.", 'Cognome', 'Nome', 'Nato/a a', 'Nato/a il', 'Data di morte', 'Luogo di morte',
      'Tumulazione Anno', 'Tumulazione Giorno', 'Tumulazione Mese', 'Tumulazione Ora',
      'Permesso Numero', 'Permesso Data', 'Zona', 'Loculo', 'Tomba di famiglia',
      'Estumulazione Anno', 'Estumulazione Giorno', 'Estumulazione Mese', 'Estumulazione Ora', 'Destinazione resti mortali', 'Note'];
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = sorted().map(r => {
      const [ty, td, tm] = parts(r.tumData), [ey, ed, em] = parts(r.estData);
      return [r.num, r.cognome, r.nome, r.natoA, itDate(r.natoIl), itDate(r.morteData), r.morteLuogo,
        ty, td, tm, r.tumOra, r.permNumero, itDate(r.permData), r.zona, r.loculo, r.tomba,
        ey, ed, em, r.estOra, r.estDestinazione, r.note].map(q).join(';');
    });
    saveFile(`registro-cimiteriale-${stamp()}.csv`, '﻿' + [head.map(q).join(';'), ...rows].join('\r\n'));
  });
  $('btn-backup').addEventListener('click', () => {
    menu.hidden = true;
    saveFile(`registro-cimiteriale-backup-${stamp()}.json`, JSON.stringify({ records: sorted() }, null, 2));
  });
  $('btn-restore').addEventListener('click', () => { menu.hidden = true; if (db && !readOnly) $('file-restore').click(); });
  $('file-restore').addEventListener('change', async (e) => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    let recs;
    try { const data = JSON.parse(await file.text()); recs = Array.isArray(data) ? data : data.records; if (!Array.isArray(recs)) throw 0; }
    catch (err) { toast('Il file scelto non è una copia di sicurezza valida.'); return; }
    if (!(await ask(`Aggiungere all'archivio le ${recs.length} registrazioni della copia? Quelle già presenti con lo stesso codice verranno aggiornate.`, 'Ripristina'))) return;
    let ok = 0;
    for (const r of recs) {
      if (!r || typeof r !== 'object') continue;
      const id = /^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(String(r.id || '')) ? String(r.id) : newId();
      const data = {}; FIELDS.forEach(k => { if (r[k] !== undefined) data[k] = r[k]; });
      data.num = +data.num || 0;
      if (await writeDoc(id, data)) ok++; else break;
    }
    toast(`Ripristinate ${ok} registrazioni`);
  });

  updateInfo();
  connect();
})();
</script>
