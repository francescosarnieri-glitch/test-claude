<title>Registro Cimiteriale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Pagina di ricerca centrata stile motore di ricerca; schede del defunto con le sezioni del registro cartaceo */
  :root {
    --bg: #ffffff; --fg: #202124; --muted: #5f6368; --line: #dadce0; --line-strong: #c9c2b8;
    --surface: #ffffff; --hover: #f1f3f4; --soft: #fbeff1; --chip: #f6f4f4;
    --accent: #7a2e3a; --accent-ink: #ffffff; --danger: #a40000; --danger-line: #e0b4b4;
    --shadow: 0 1px 6px rgba(32,33,36,.28); --scrim: rgba(0,0,0,.45);
    --toast-bg: #222222; --toast-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #17181a; --fg: #e8e6e3; --muted: #a3a6ab; --line: #3a3c40; --line-strong: #4a4c50;
    --surface: #202124; --hover: #2b2c30; --soft: #33222a; --chip: #2a2b2f;
    --accent: #d98a99; --accent-ink: #1b0f12; --danger: #ff8a8a; --danger-line: #6b3434;
    --shadow: 0 1px 8px rgba(0,0,0,.6); --scrim: rgba(0,0,0,.65);
    --toast-bg: #e8e6e3; --toast-fg: #17181a; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #17181a; --fg: #e8e6e3; --muted: #a3a6ab; --line: #3a3c40; --line-strong: #4a4c50;
    --surface: #202124; --hover: #2b2c30; --soft: #33222a; --chip: #2a2b2f;
    --accent: #d98a99; --accent-ink: #1b0f12; --danger: #ff8a8a; --danger-line: #6b3434;
    --shadow: 0 1px 8px rgba(0,0,0,.6); --scrim: rgba(0,0,0,.65);
    --toast-bg: #e8e6e3; --toast-fg: #17181a; color-scheme: dark }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; background: var(--bg); color: var(--fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; color: var(--fg); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger-line); }

  /* Barra superiore */
  .topbar { position: relative; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-block: 14px; }
  .menu-list { position: absolute; right: 0; top: 62px; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 220px; z-index: 20; padding: 6px 0; }
  .menu-list button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 10px 16px; background: transparent; }
  .menu-list button:hover { background: var(--hover); }
  .menu-list .info { padding: 6px 16px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: 4px; }

  /* Pagina iniziale */
  .home { display: flex; flex-direction: column; align-items: center; transition: padding .2s; }
  .home.centered { padding-top: 16vh; }
  .logo { font-size: 2.6rem; font-weight: 300; color: var(--accent); letter-spacing: .04em; margin: 0 0 6px; text-align: center; text-wrap: balance; }
  .logo b { font-weight: 700; }
  .tagline { color: var(--muted); margin: 0 0 26px; font-size: .95rem; text-align: center; }
  .home:not(.centered) .logo { font-size: 1.6rem; }
  .home:not(.centered) .tagline { display: none; }
  .status { margin-top: 18px; color: var(--muted); font-size: .88rem; text-align: center; }

  .searchbox { position: relative; width: 100%; max-width: 620px; }
  .searchbar { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 26px; padding: 0 16px; height: 50px; background: var(--surface); }
  .searchbar:hover, .searchbar:focus-within { box-shadow: var(--shadow); border-color: transparent; }
  .searchbar.open { border-radius: 24px 24px 0 0; box-shadow: var(--shadow); border-color: transparent; }
  .searchbar svg { flex: none; color: var(--muted); }
  .searchbar input { flex: 1; border: 0; outline: 0; font-size: 1.05rem; background: transparent; min-width: 0; color: var(--fg); }
  .searchbar .x { border: 0; background: none; padding: 4px 6px; color: var(--muted); font-size: 1.3rem; line-height: 1; }
  .suggest { position: absolute; left: 0; right: 0; top: 50px; background: var(--surface); border-radius: 0 0 24px 24px; box-shadow: var(--shadow); padding: 4px 0 12px; z-index: 10; border-top: 1px solid var(--line); }
  .suggest div { padding: 9px 20px 9px 48px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .suggest div.sel, .suggest div:hover { background: var(--hover); }
  .suggest small { color: var(--muted); white-space: nowrap; }

  /* Risultati */
  .results { max-width: 900px; margin: 24px auto 40px; }
  .count { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
  .scheda { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden; background: var(--surface); }
  .scheda-head { background: var(--soft); padding: 12px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
  .scheda-head h3 { margin: 0; font-size: 1.25rem; color: var(--accent); }
  .scheda-head .meta { color: var(--muted); font-size: .88rem; }
  .scheda-body { display: grid; grid-template-columns: 1fr 1fr; }
  .blk { padding: 12px 16px; border-top: 1px solid var(--line); min-width: 0; }
  .blk:nth-child(odd) { border-right: 1px solid var(--line); }
  @media (max-width: 700px) { .scheda-body { grid-template-columns: 1fr; } .blk:nth-child(odd) { border-right: 0; } }
  .blk h4 { margin: 0 0 8px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 2px 10px; font-size: .95rem; margin-bottom: 6px; align-items: baseline; }
  .row span { color: var(--muted); line-height: 1.25; }
  .row b { min-width: 0; overflow-wrap: anywhere; }
  .rows { margin-top: 8px; }
  .menu-list .info.warn { color: var(--danger); font-weight: 600; }
  #btn-menu.warn { border-color: var(--danger); color: var(--danger); }
  .agenda-index { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
  .agenda-index button { padding: 4px 0; width: 2.1em; font-weight: 600; color: var(--accent); }
  .agenda-index button:disabled { color: var(--line-strong); cursor: default; }
  .agenda-letter { margin: 18px 0 6px; font-size: 1.1rem; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .agenda-item { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 10px 8px; background: transparent; }
  .agenda-item:hover { background: var(--hover); }
  .agenda-item small { color: var(--muted); white-space: nowrap; }
  .dmy { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-variant-numeric: tabular-nums; }
  .dmy div { padding: 4px; }
  .dmy .h { background: var(--chip); font-size: .7rem; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .scheda-foot { border-top: 1px solid var(--line); padding: 8px 16px; display: flex; justify-content: space-between; gap: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }

  /* Modulo e finestre */
  .overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    overflow-y: auto; z-index: 50; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 1100px; padding: 20px; box-shadow: var(--shadow); }
  .modal.small { max-width: 440px; margin-top: 18vh; }
  .modal.small p { margin: 0 0 16px; line-height: 1.45; white-space: pre-line; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .modal-head h2 { margin: 0; color: var(--accent); font-size: 1.25rem; }
  .modal-head .close { border: 0; font-size: 1.6rem; line-height: 1; padding: 2px 8px; background: none; }
  fieldset { border: 1px solid var(--line-strong); border-radius: 6px; margin: 0 0 12px; padding: 10px 12px 4px; min-width: 0; }
  legend { font-weight: 700; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); padding: 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 1fr)); gap: 0 14px; }
  .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .cols-2 > div { min-width: 0; }
  @media (max-width: 800px) { .cols-2 { grid-template-columns: 1fr; } }
  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
  .field { display: flex; gap: 4px; margin-top: 3px; }
  .field input, .field textarea, .field select { width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--line-strong); border-radius: 5px; font: inherit; color: var(--fg); background: var(--bg); }
  .field textarea { min-height: 38px; resize: vertical; }
  .field [data-upper] { text-transform: uppercase; }
  .field [data-upper]::placeholder { text-transform: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .actions .left { margin-right: auto; }

  #toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-fg); padding: 10px 18px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100; max-width: calc(100% - 32px); }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .home, #toast { transition: none; } }
</style>

<div class="topbar">
  <button id="btn-menu" title="Altre funzioni" aria-haspopup="true">☰</button>
  <div class="menu-list" id="menu-list" hidden>
    <button id="btn-agenda">Elenco alfabetico</button>
    <button id="btn-csv">Esporta in Excel</button>
    <button id="btn-backup">Salva copia di sicurezza</button>
    <button id="btn-restore">Ripristina copia di sicurezza</button>
    <div class="info" id="db-info"></div>
    <div class="info" id="backup-info"></div>
  </div>
  <input type="file" id="file-restore" accept=".json" hidden>
  <button class="primary" id="btn-add" disabled>+ Aggiungi defunto</button>
</div>

<div class="home centered" id="home">
  <h1 class="logo">Registro <b>Cimiteriale</b></h1>
  <p class="tagline">Scrivi nome e cognome del defunto</p>
  <div class="searchbox">
    <form class="searchbar" id="searchbar" autocomplete="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Es. Rossi Mario" aria-label="Cerca defunto">
      <button type="button" class="x" id="q-clear" title="Cancella" hidden>×</button>
    </form>
    <div class="suggest" id="suggest" hidden></div>
  </div>
  <div class="status" id="status">Caricamento dell'archivio…</div>
</div>

<div class="results" id="results" hidden></div>

<!-- Modulo Aggiungi defunto -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title">
    <div class="modal-head">
      <h2 id="form-title">Aggiungi defunto</h2>
      <button type="button" class="close" id="btn-close" title="Chiudi">×</button>
    </div>
    <form id="form" autocomplete="off">
      <input type="hidden" name="id" id="f-id">
      <div class="cols-2">
        <div>
          <fieldset>
            <legend>Defunto</legend>
            <div class="grid">
              <label>Num. d'ord. <em>(automatico)</em>
                <div class="field"><input name="num" id="f-num" type="number" min="1" required></div></label>
            </div>
            <div class="grid">
              <label>Cognome
                <div class="field"><input name="cognome" id="f-cognome" required data-upper autocapitalize="characters"></div></label>
              <label>Nome
                <div class="field"><input name="nome" id="f-nome" required data-upper autocapitalize="characters"></div></label>
              <label>Nato/a a
                <div class="field"><input name="natoA" id="f-natoA" data-upper autocapitalize="characters"></div></label>
              <label>il (data di nascita)
                <div class="field"><input name="natoIl" id="f-natoIl" type="text" inputmode="numeric" placeholder="gg/mm/aaaa" maxlength="10" autocomplete="off" data-date></div></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Data e luogo di morte</legend>
            <div class="grid">
              <label>Data
                <div class="field"><input name="morteData" id="f-morteData" type="text" inputmode="numeric" placeholder="gg/mm/aaaa" maxlength="10" autocomplete="off" data-date></div></label>
              <label>Luogo
                <div class="field"><input name="morteLuogo" id="f-morteLuogo" data-upper autocapitalize="characters"></div></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Tumulazione</legend>
            <div class="grid">
              <label>Zona
                <div class="field"><select name="zona" id="f-zona"><option value=""></option><option value="1° AMPLIAMENTO">1° AMPLIAMENTO</option><option value="2° AMPLIAMENTO">2° AMPLIAMENTO</option><option value="3° AMPLIAMENTO">3° AMPLIAMENTO</option></select></div></label>
              <label>Reparto
                <div class="field"><select name="locReparto" id="f-locReparto"><option value=""></option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option><option value="F">F</option></select></div></label>
              <label>Fila
                <div class="field"><select name="locFila" id="f-locFila"><option value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></div></label>
              <label>N° loculo
                <div class="field"><select name="locNum" id="f-locNum"><option value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option><option value="60">60</option><option value="61">61</option><option value="62">62</option><option value="63">63</option><option value="64">64</option><option value="65">65</option><option value="66">66</option><option value="67">67</option><option value="68">68</option><option value="69">69</option><option value="70">70</option><option value="71">71</option><option value="72">72</option><option value="73">73</option><option value="74">74</option><option value="75">75</option><option value="76">76</option><option value="77">77</option><option value="78">78</option><option value="79">79</option><option value="80">80</option><option value="81">81</option><option value="82">82</option><option value="83">83</option><option value="84">84</option><option value="85">85</option><option value="86">86</option><option value="87">87</option><option value="88">88</option><option value="89">89</option><option value="90">90</option><option value="91">91</option><option value="92">92</option><option value="93">93</option><option value="94">94</option><option value="95">95</option><option value="96">96</option><option value="97">97</option><option value="98">98</option><option value="99">99</option></select></div></label>
              <label>Lato
                <div class="field"><select name="locLato" id="f-locLato"><option value=""></option><option value="DESTRO">DESTRO</option><option value="SINISTRO">SINISTRO</option></select></div></label>
              <label>Tipo
                <div class="field"><select name="locTipo" id="f-locTipo"><option value=""></option><option value="LOCULO">LOCULO</option><option value="OSSARIO">OSSARIO</option><option value="LOCULO SPECIALE">LOCULO SPECIALE</option></select></div></label>
              <label>Cappella
                <div class="field"><select name="locCappella" id="f-locCappella"><option value=""></option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option><option value="H">H</option><option value="I">I</option><option value="J">J</option><option value="K">K</option><option value="L">L</option><option value="M">M</option><option value="N">N</option><option value="O">O</option><option value="P">P</option><option value="Q">Q</option><option value="R">R</option><option value="S">S</option><option value="T">T</option><option value="U">U</option><option value="V">V</option><option value="W">W</option><option value="X">X</option><option value="Y">Y</option><option value="Z">Z</option></select></div></label>
              <input type="hidden" name="loculo" id="f-loculo">
              <label>Tomba di famiglia
                <div class="field"><input name="tomba" id="f-tomba" list="dl-tomba" data-upper autocapitalize="characters"></div></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Inumazione</legend>
            <div class="grid">
              <label>Campo
                <div class="field"><select name="inumCampo" id="f-inumCampo"><option value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div></label>
              <label>Fila
                <div class="field"><select name="inumFila" id="f-inumFila"><option value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></div></label>
              <label>Ceppo n°
                <div class="field"><select name="inumFossa" id="f-inumFossa"><option value=""></option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></div></label>
            </div>
          </fieldset>
        </div>
        <div>
          <fieldset>
            <legend>Estumulazione</legend>
            <div class="grid">
              <label>Data
                <div class="field"><input name="estData" id="f-estData" type="text" inputmode="numeric" placeholder="gg/mm/aaaa" maxlength="10" autocomplete="off" data-date></div></label>
              <label>Ora
                <div class="field"><input name="estOra" id="f-estOra" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" autocomplete="off" data-time></div></label>
            </div>
            <label>Destinazione dei resti mortali
              <div class="field"><textarea name="estDestinazione" id="f-estDestinazione" data-upper autocapitalize="characters"></textarea></div></label>
          </fieldset>
          <fieldset>
            <legend>Esumazione</legend>
            <div class="grid">
              <label>Data
                <div class="field"><input name="esumData" id="f-esumData" type="text" inputmode="numeric" placeholder="gg/mm/aaaa" maxlength="10" autocomplete="off" data-date></div></label>
              <label>Ora
                <div class="field"><input name="esumOra" id="f-esumOra" type="text" inputmode="numeric" placeholder="hh:mm" maxlength="5" autocomplete="off" data-time></div></label>
            </div>
            <label>Destinazione dei resti mortali
              <div class="field"><textarea name="esumDestinazione" id="f-esumDestinazione" data-upper autocapitalize="characters"></textarea></div></label>
          </fieldset>
          <fieldset>
            <legend>Note</legend>
            <label>Annotazioni
              <div class="field"><textarea name="note" id="f-note" data-upper autocapitalize="characters"></textarea></div></label>
          </fieldset>
        </div>
      </div>
      <datalist id="dl-tomba"></datalist>
      <div class="actions">
        <button type="button" class="danger left" id="btn-delete" hidden>Elimina</button>
        <button type="button" id="btn-cancel">Annulla</button>
        <button type="submit" class="primary" id="btn-save">Salva</button>
      </div>
    </form>
  </div>
</div>

<!-- Finestra di conferma -->
<div class="overlay" id="ask" hidden>
  <div class="modal small" role="alertdialog" aria-modal="true">
    <p id="ask-text"></p>
    <div class="actions">
      <button type="button" id="ask-no">Annulla</button>
      <button type="button" class="primary" id="ask-yes">Conferma</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(function () {
  const COLL = 'defunti';
  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const F = (n) => form.elements[n];

  let db = null, records = [], loaded = false, readOnly = false;

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000);
  }
  function ask(text, yesLabel) {
    return new Promise((resolve) => {
      $('ask-text').textContent = text;
      $('ask-yes').textContent = yesLabel || 'Conferma';
      $('ask').hidden = false; $('ask-yes').focus();
      const done = (v) => { $('ask').hidden = true; $('ask-yes').onclick = $('ask-no').onclick = null; resolve(v); };
      $('ask-yes').onclick = () => done(true);
      $('ask-no').onclick = () => done(false);
    });
  }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const itDate = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
  // Adegua le registrazioni salvate con versioni precedenti (Ossario o cappella in un solo campo)
  function normalize(r) {
    if (r.locTipo === 'CAPPELLA') {
      const oss = /\bOSSARIO\b/.test(r.loculo || '');
      r = { ...r, locTipo: oss ? 'OSSARIO' : 'LOCULO', loculo: oss ? (r.loculo || '').replace(/\bOSSARIO\b/, '').replace(/\s+/g, ' ').trim() : r.loculo };
    }
    return r;
  }
  const parts = (iso) => { if (!iso) return ['', '', '']; const [y, m, d] = iso.split('-'); return [y, d, m]; };
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const nextNum = () => records.reduce((m, r) => Math.max(m, +r.num || 0), 0) + 1;
  const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const FIELDS = ['num','cognome','nome','natoA','natoIl','morteData','morteLuogo','tumData','tumOra','permNumero','permData','zona','loculo','locReparto','locFila','locNum','locLato','locTipo','locCappella','tomba','estData','estOra','estDestinazione','inumData','inumOra','inumZona','inumCampo','inumFila','inumFossa','esumData','esumOra','esumDestinazione','note','creato','modificato'];

  function setStatus(msg) { const s = $('status'); s.textContent = msg || ''; s.hidden = !msg; }
  function updateInfo() { $('db-info').textContent = loaded ? `Defunti registrati: ${records.length}` : 'Archivio non ancora caricato'; if (typeof updateBackupInfo === 'function') updateBackupInfo(); }

  // ---------- Archivio (database dell'artifact) ----------
  async function connect() {
    try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) { setStatus("Archivio non disponibile. Apri il registro dal link di Claude, dopo aver effettuato l'accesso."); return; }
    const timer = setTimeout(() => { if (!loaded) setStatus("L'archivio non risponde ancora. Controlla la connessione internet."); }, 10000);
    db.collection(COLL).onSnapshot((snap) => {
      records = snap.docs.map(d => normalize({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); }
      if (loaded || records.length) {
        setStatus(records.length ? '' : 'Archivio vuoto: premi «Aggiungi defunto» per registrare il primo.');
        $('btn-add').disabled = readOnly;
      }
      updateInfo();
      if (!$('results').hidden && agendaOpen) showAgenda();
      else if (!$('results').hidden && lastQuery !== null) refreshResults();
    }, (err) => {
      clearTimeout(timer);
      setStatus(err.code === 'revoked' ? 'Accesso all\'archivio non più disponibile.' : 'Impossibile leggere l\'archivio. Ricarica la pagina più tardi.');
    });
  }

  async function writeDoc(id, data) {
    try { await db.collection(COLL).doc(id).set(data); return true; }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise(r => setTimeout(r, 800 + Math.random() * 800));
        try { await db.collection(COLL).doc(id).set(data); return true; } catch (e2) { e = e2; }
      }
      if (e && e.code === 'invalid_argument') { readOnly = true; $('btn-add').disabled = true; toast('Non hai il permesso di modificare questo registro.'); }
      else if (e && e.code === 'quota_exceeded') toast('Archivio pieno: non è possibile aggiungere altri defunti.');
      else toast('Salvataggio non riuscito. Controlla la connessione e riprova.');
      return false;
    }
  }

  // ---------- Ricerca ----------
  const byName = (a, b) => (a.cognome + ' ' + a.nome).localeCompare(b.cognome + ' ' + b.nome, 'it') || a.num - b.num;
  function search(q) {
    const k = norm(q).replace(/\s+/g, ' ').trim();
    if (!k) return [];
    return records.filter(r => norm(`${r.cognome} ${r.nome}`).replace(/\s+/g, ' ').trim().startsWith(k)).sort(byName);
  }

  const qInput = $('q'), sugg = $('suggest'), bar = $('searchbar');
  let selIdx = -1, suggList = [], lastQuery = null, lastIds = null;

  function showSuggest() {
    const v = qInput.value;
    $('q-clear').hidden = !v;
    suggList = search(v).slice(0, 8); selIdx = -1;
    if (!v.trim() || !suggList.length) { hideSuggest(); return; }
    sugg.innerHTML = suggList.map((r, i) =>
      `<div data-i="${i}">${esc(r.cognome)} ${esc(r.nome)}<small>${r.morteData ? '† ' + itDate(r.morteData) : 'n. ' + esc(r.num)}</small></div>`).join('');
    sugg.hidden = false; bar.classList.add('open');
  }
  function hideSuggest() { sugg.hidden = true; bar.classList.remove('open'); }
  function pick(r) { qInput.value = `${r.cognome} ${r.nome}`; hideSuggest(); showResults([r], true); }

  qInput.addEventListener('input', showSuggest);
  qInput.addEventListener('focus', showSuggest);
  qInput.addEventListener('keydown', (e) => {
    if (sugg.hidden) return;
    const items = sugg.querySelectorAll('div');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      selIdx = (selIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((d, i) => d.classList.toggle('sel', i === selIdx));
    } else if (e.key === 'Escape') hideSuggest();
  });
  sugg.addEventListener('mousedown', (e) => {
    const d = e.target.closest('[data-i]'); if (!d) return;
    e.preventDefault(); pick(suggList[+d.dataset.i]);
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.searchbox')) hideSuggest(); });
  bar.addEventListener('submit', (e) => {
    e.preventDefault();
    if (selIdx >= 0 && suggList[selIdx]) { pick(suggList[selIdx]); return; }
    hideSuggest();
    if (!qInput.value.trim()) { goHome(); return; }
    showResults(search(qInput.value), false);
  });
  $('q-clear').addEventListener('click', () => { qInput.value = ''; goHome(); qInput.focus(); });

  function goHome() { agendaOpen = false; lastQuery = null; lastIds = null; $('home').classList.add('centered'); $('results').hidden = true; $('q-clear').hidden = !qInput.value; hideSuggest(); }

  function showResults(list, exact) {
    agendaOpen = false;
    lastQuery = qInput.value; lastIds = exact ? list.map(r => r.id) : null;
    $('q-clear').hidden = !qInput.value;
    $('home').classList.remove('centered');
    const res = $('results'); res.hidden = false;
    if (!list.length) {
      res.innerHTML = `<div class="empty">Nessun defunto trovato per «${esc(qInput.value)}».<br><br>
        ${readOnly ? '' : '<button class="primary" id="add-from-empty">+ Aggiungi defunto</button>'}</div>`;
      const b = $('add-from-empty'); if (b) b.onclick = () => openForm(null, qInput.value);
      return;
    }
    res.innerHTML = `<div class="count">${list.length === 1 ? '1 risultato' : list.length + ' risultati'}</div>` + list.map(scheda).join('');
  }
  function refreshResults() {
    const list = lastIds ? records.filter(r => lastIds.includes(r.id)) : search(lastQuery);
    showResults(list, !!lastIds);
  }
  $('results').addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) { const h = document.getElementById('lettera-' + jump.dataset.jump); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const open = e.target.closest('[data-open]');
    if (open) { const r = records.find(x => x.id === open.dataset.open); if (r) { qInput.value = `${r.cognome} ${r.nome}`; showResults([r], true); window.scrollTo(0, 0); } return; }
    const del = e.target.closest('[data-del]');
    if (del) { deleteRecord(del.dataset.del); return; }
    const b = e.target.closest('[data-edit]'); if (!b) return;
    const r = records.find(x => x.id === b.dataset.edit); if (r) openForm(r);
  });

  async function deleteRecord(id) {
    const r = records.find(x => x.id === id);
    if (!r || !db || !(await ask(`Eliminare definitivamente ${r.cognome} ${r.nome} (n. ${r.num})?`, 'Elimina'))) return false;
    try { await db.collection(COLL).doc(id).delete(); }
    catch (e) { toast('Eliminazione non riuscita. Riprova.'); return false; }
    records = records.filter(x => x.id !== id);
    toast(`Eliminato ${r.cognome} ${r.nome}`);
    if (lastIds) lastIds = lastIds.filter(x => x !== id);
    if (agendaOpen) { showAgenda(); return true; }
    const rest = lastIds ? lastIds.length : (lastQuery ? search(lastQuery).length : 0);
    if (!rest) { qInput.value = ''; goHome(); } else refreshResults();
    return true;
  }

  function dmy(iso, ora) {
    const [y, d, m] = parts(iso);
    return `<div class="dmy"><div class="h">Anno</div><div class="h">Giorno</div><div class="h">Mese</div><div class="h">Ora</div>
      <div>${y || '—'}</div><div>${d || '—'}</div><div>${m || '—'}</div><div>${esc(ora) || '—'}</div></div>`;
  }
  const row = (k, v) => `<div class="row"><span>${k}</span><b>${esc(v) || '—'}</b></div>`;
  const rowIf = (k, v) => v ? row(k, v) : '';
  const dmyIf = (iso, ora) => (iso || ora) ? dmy(iso, ora) : '';
  const blk = (title, inner) => `<div class="blk"><h4>${title}</h4>${inner}</div>`;

  function scheda(r) {
    const tumRows = rowIf('Zona', r.zona) + rowIf('Reparto', r.locReparto) + rowIf('Fila', r.locFila) + rowIf('N°', r.locNum) +
      rowIf('Lato', r.locLato) + rowIf('Tipo', r.locTipo) + rowIf('Cappella', r.locCappella) + rowIf('Loculo', r.loculo) + rowIf('Tomba di famiglia', r.tomba);
    const inumRows = rowIf('Campo', r.inumCampo) + rowIf('Fila', r.inumFila) + rowIf('Ceppo n°', r.inumFossa);
    const sez = [];
    if (tumRows) sez.push(blk('Tumulazione', tumRows));
    if (inumRows) sez.push(blk('Inumazione', inumRows));
    if (r.estData || r.estOra || r.estDestinazione) sez.push(blk('Estumulazione', dmyIf(r.estData, r.estOra) + (r.estDestinazione ? `<div class="rows">${row('Destinazione dei resti mortali', r.estDestinazione)}</div>` : '')));
    if (r.esumData || r.esumOra || r.esumDestinazione) sez.push(blk('Esumazione', dmyIf(r.esumData, r.esumOra) + (r.esumDestinazione ? `<div class="rows">${row('Destinazione dei resti mortali', r.esumDestinazione)}</div>` : '')));
    return `<article class="scheda">
      <div class="scheda-head">
        <h3>${esc(r.cognome)} ${esc(r.nome)}</h3>
        <div class="meta">Num. d'ord. <b>${esc(r.num)}</b></div>
      </div>
      <div class="scheda-body">
        ${blk('Defunto', row('Nato/a a', r.natoA) + row('il', itDate(r.natoIl)))}
        ${blk('Data e luogo di morte', row('Data', itDate(r.morteData)) + row('Luogo', r.morteLuogo))}
        ${sez.join('\n        ')}
        ${r.note ? `<div class="blk" style="grid-column:1/-1;border-right:0"><h4>Note</h4>${esc(r.note)}</div>` : ''}
      </div>
      ${readOnly ? '' : `<div class="scheda-foot"><button class="danger" data-del="${esc(r.id)}">Elimina</button><button data-edit="${esc(r.id)}">Modifica</button></div>`}
    </article>`;
  }

  // ---------- Elenco alfabetico ----------
  function showAgenda() {
    menu.hidden = true; hideSuggest();
    qInput.value = ''; $('q-clear').hidden = false;
    lastQuery = null; lastIds = null; agendaOpen = true;
    $('home').classList.remove('centered');
    const res = $('results'); res.hidden = false;
    const list = records.slice().sort(byName);
    if (!list.length) { res.innerHTML = '<div class="empty">Nessun defunto registrato.</div>'; return; }
    const groups = {};
    list.forEach(r => { const L = (norm(r.cognome).charAt(0) || '#').toUpperCase(); (groups[L] = groups[L] || []).push(r); });
    const all = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
    Object.keys(groups).forEach(L => { if (!all.includes(L)) all.push(L); });
    res.innerHTML = `<div class="count">Elenco alfabetico · ${list.length} defunti</div>
      <div class="agenda-index">${all.map(L => `<button data-jump="${esc(L)}" ${groups[L] ? '' : 'disabled'}>${esc(L)}</button>`).join('')}</div>
      ${Object.keys(groups).sort((a, b) => a.localeCompare(b)).map(L => `<h3 class="agenda-letter" id="lettera-${esc(L)}">${esc(L)}</h3>` +
        groups[L].map(r => `<button class="agenda-item" data-open="${esc(r.id)}"><span><b>${esc(r.cognome)}</b> ${esc(r.nome)}</span><small>${r.morteData ? '† ' + itDate(r.morteData) : "n. " + esc(r.num)}</small></button>`).join('')).join('')}`;
  }
  let agendaOpen = false;

  // ---------- Modulo Aggiungi / Modifica ----------
  function openForm(r, prefill) {
    form.reset();
    form.querySelectorAll('select option[data-extra]').forEach(o => o.remove());
    if (r) {
      for (const el of form.elements) {
        if (!el.name || !(el.name in r)) continue;
        const v = r[el.name] ?? '';
        if (el.tagName === 'SELECT' && v && ![...el.options].some(o => o.value === v)) {
          const o = document.createElement('option'); o.value = o.textContent = v; o.dataset.extra = '1'; el.appendChild(o);
        }
        el.value = v;
      }
      form.querySelectorAll('[data-date]').forEach(el => { el.value = isoToIt(el.value); });
      F('id').value = r.id;
      $('form-title').textContent = `Modifica — ${r.cognome} ${r.nome}`;
      $('btn-delete').hidden = false;
    } else {
      F('id').value = ''; F('loculo').value = '';
      F('num').value = nextNum();
      if (prefill) {
        const w = prefill.trim().toUpperCase().split(/\s+/);
        F('cognome').value = w[0] || ''; F('nome').value = w.slice(1).join(' ');
      }
      $('form-title').textContent = 'Aggiungi defunto';
      $('btn-delete').hidden = true;
    }
    const uniq = (k) => [...new Set(records.map(x => x[k]).filter(Boolean))].sort();
    $('dl-tomba').innerHTML = uniq('tomba').map(v => `<option value="${esc(v)}">`).join('');
    $('overlay').hidden = false;
    formSnapshot = formState();
    $('overlay').scrollTop = 0;
    setTimeout(() => F('cognome').focus(), 50);
  }
  function closeForm() { $('overlay').hidden = true; }
  let formSnapshot = '';
  const formState = () => JSON.stringify([...form.elements].filter(el => el.name).map(el => el.value));
  async function requestClose() {
    if (formState() !== formSnapshot && !(await ask('Hai dati non salvati. Uscire senza salvare?', 'Esci senza salvare'))) return;
    closeForm();
  }

  $('btn-add').addEventListener('click', () => openForm(null));
  $('btn-close').addEventListener('click', requestClose);
  $('btn-cancel').addEventListener('click', requestClose);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('overlay').hidden && $('ask').hidden) requestClose(); });
  form.querySelectorAll('[data-upper]').forEach(i => i.addEventListener('blur', () => { i.value = i.value.trim().toUpperCase(); }));

  // ---------- Date scritte a mano (gg/mm/aaaa) ----------
  function isoToIt(v) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (v || ''); }
  function itToIso(v) {
    v = (v || '').trim(); if (!v) return '';
    let m = /^(\d{1,2})[\/.\- ](\d{1,2})[\/.\- ](\d{4})$/.exec(v) || /^(\d{2})(\d{2})(\d{4})$/.exec(v);
    if (!m) return null;
    const d = +m[1], mo = +m[2], y = +m[3];
    if (y < 1800 || y > 2200 || mo < 1 || mo > 12 || d < 1) return null;
    if (d > new Date(y, mo, 0).getDate()) return null;
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  function autoDate(v) {
    const endsSep = /[\/.\- ]$/.test(v);
    const segs = v.split(/[\/.\- ]+/);
    let digits = '';
    segs.forEach((seg, i) => {
      seg = seg.replace(/\D/g, '');
      const closed = i < segs.length - 1 || endsSep;
      if (closed && seg.length === 1 && digits.length < 4) seg = '0' + seg;
      digits += seg;
    });
    digits = digits.slice(0, 8);
    let out = digits.slice(0, 2);
    if (digits.length > 2) out += '/' + digits.slice(2, 4);
    if (digits.length > 4) out += '/' + digits.slice(4);
    if (endsSep && (digits.length === 2 || digits.length === 4)) out += '/';
    return out;
  }
  // ---------- Orari scritti a mano (hh:mm) ----------
  function autoTime(v) {
    const endsSep = /[:.\s]$/.test(v);
    const segs = v.split(/[:.\s]+/);
    let h = (segs[0] || '').replace(/\D/g, ''), m = segs.slice(1).join('').replace(/\D/g, '');
    if (segs.length > 1 && h.length === 1) h = '0' + h;
    let digits = (h + m).slice(0, 4);
    let out = digits.slice(0, 2);
    if (digits.length > 2) out += ':' + digits.slice(2);
    else if (digits.length === 2 && (endsSep || segs.length > 1)) out += ':';
    return out;
  }
  function parseTime(v) {
    v = (v || '').trim(); if (!v) return '';
    const m = /^(\d{1,2})(?:[:.\s]?(\d{2}))?$/.exec(v);
    if (!m) return null;
    const h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
    if (h > 23 || mi > 59) return null;
    return `${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')}`;
  }
  form.querySelectorAll('[data-time]').forEach(el => el.addEventListener('input', (e) => {
    if (e.inputType && !e.inputType.startsWith('insert')) return;
    const f = autoTime(el.value);
    if (f !== el.value) el.value = f;
  }));
  form.querySelectorAll('[data-date]').forEach(el => el.addEventListener('input', (e) => {
    if (e.inputType && !e.inputType.startsWith('insert')) return;
    const f = autoDate(el.value);
    if (f !== el.value) el.value = f;
  }));

  function dateWarnings(d) {
    const w = [], oggi = new Date().toISOString().slice(0, 10);
    const lab = { natoIl: 'nascita', morteData: 'morte', estData: 'estumulazione', esumData: 'esumazione' };
    for (const k in lab) if (d[k] && d[k] > oggi) w.push(`la data di ${lab[k]} (${itDate(d[k])}) è nel futuro`);
    const prima = (a, b) => { if (d[a] && d[b] && d[b] < d[a]) w.push(`la data di ${lab[b]} (${itDate(d[b])}) è prima della ${lab[a]} (${itDate(d[a])})`); };
    prima('natoIl', 'morteData'); prima('morteData', 'estData'); prima('morteData', 'esumData');
    return w;
  }

  let saving = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (saving || !db) return;
    const data = {};
    for (const el of form.elements) if (el.name) data[el.name] = el.value.trim();
    const id = data.id || newId(); delete data.id;
    form.querySelectorAll('[data-upper]').forEach(el => { data[el.name] = data[el.name].toUpperCase(); });
    for (const el of form.querySelectorAll('[data-date]')) {
      const iso = itToIso(data[el.name]);
      if (iso === null) {
        toast(`Data non valida: «${data[el.name]}». Scrivila come gg/mm/aaaa, ad esempio 23/01/2009.`);
        el.focus(); return;
      }
      data[el.name] = iso;
    }
    for (const el of form.querySelectorAll('[data-time]')) {
      const t = parseTime(data[el.name]);
      if (t === null) {
        toast(`Ora non valida: «${data[el.name]}». Scrivila come hh:mm, ad esempio 09:30.`);
        el.focus(); return;
      }
      data[el.name] = t;
    }
    data.num = +data.num;
    const warn = dateWarnings(data);
    if (warn.length && !(await ask('Controlla le date:\n• ' + warn.join('\n• ') + '\n\nSalvare comunque?', 'Salva comunque'))) return;
    const dup = records.find(r => r.num === data.num && r.id !== id);
    if (dup && !(await ask(`Il numero d'ordine ${data.num} è già usato da ${dup.cognome} ${dup.nome}. Salvare comunque?`, 'Salva comunque'))) return;
    const old = records.find(r => r.id === id);
    if (old) { data.creato = old.creato || ''; data.modificato = new Date().toISOString(); }
    else data.creato = new Date().toISOString();
    saving = true; $('btn-save').disabled = true;
    const ok = await writeDoc(id, data);
    saving = false; $('btn-save').disabled = false;
    if (!ok) return;
    toast(old ? 'Modifiche salvate' : `Registrato n. ${data.num}: ${data.cognome} ${data.nome}`);
    closeForm();
    qInput.value = `${data.cognome} ${data.nome}`;
    const saved = { ...data, id };
    if (!records.some(r => r.id === id)) records.push(saved);
    showResults([records.find(r => r.id === id) || saved], true);
  });

  $('btn-delete').addEventListener('click', async () => {
    if (await deleteRecord(F('id').value)) closeForm();
  });

  // ---------- Menu: Excel / copia di sicurezza ----------
  const menu = $('menu-list');
  $('btn-menu').addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
  document.addEventListener('click', (e) => { if (!e.target.closest('#menu-list') && e.target.id !== 'btn-menu') menu.hidden = true; });

  async function saveFile(filename, data) {
    let dl = null;
    try { dl = window.claude ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (!dl) { toast('Il salvataggio di file non è disponibile qui.'); return; }
    try { const r = await dl.save({ filename, data }); if (r && r.status === 'saved') toast('File salvato'); return !!r; }
    catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') toast('File non salvato.'); return false; }
  }
  const BK = 'registro.ultimaCopia';
  function lastBackup() { try { return +localStorage.getItem(BK) || 0; } catch (e) { return 0; } }
  function updateBackupInfo() {
    const t = lastBackup(), el = $('backup-info');
    const giorni = t ? Math.floor((Date.now() - t) / 86400000) : null;
    const late = records.length > 0 && (giorni === null || giorni >= 7);
    el.textContent = giorni === null ? 'Nessuna copia di sicurezza fatta' : giorni === 0 ? 'Ultima copia di sicurezza: oggi' : giorni === 1 ? 'Ultima copia di sicurezza: ieri' : `Ultima copia di sicurezza: ${giorni} giorni fa`;
    el.classList.toggle('warn', late);
    $('btn-menu').classList.toggle('warn', late);
    $('btn-menu').title = late ? 'Fai una copia di sicurezza' : 'Altre funzioni';
  }
  const stamp = () => new Date().toISOString().slice(0, 10);
  const sorted = () => records.slice().sort((a, b) => a.num - b.num);

  $('btn-agenda').addEventListener('click', showAgenda);
  $('btn-csv').addEventListener('click', () => {
    menu.hidden = true;
    const head = ["Num. d'ord.", 'Cognome', 'Nome', 'Nato/a a', 'Nato/a il', 'Data di morte', 'Luogo di morte',
      'Zona', 'Reparto', 'Fila', 'N°', 'Lato', 'Tipo', 'Cappella', 'Loculo (vecchio)', 'Tomba di famiglia',
      'Campo', 'Fila inumazione', 'Ceppo n°',
      'Estumulazione Anno', 'Estumulazione Giorno', 'Estumulazione Mese', 'Estumulazione Ora', 'Destinazione resti mortali (estumulazione)',
      'Esumazione Anno', 'Esumazione Giorno', 'Esumazione Mese', 'Esumazione Ora', 'Destinazione resti mortali (esumazione)',
      'Note'];
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = sorted().map(r => {
      const [ey, ed, em] = parts(r.estData), [sy, sd, sm] = parts(r.esumData);
      return [r.num, r.cognome, r.nome, r.natoA, itDate(r.natoIl), itDate(r.morteData), r.morteLuogo,
        r.zona, r.locReparto, r.locFila, r.locNum, r.locLato, r.locTipo, r.locCappella, r.loculo, r.tomba,
        r.inumCampo, r.inumFila, r.inumFossa,
        ey, ed, em, r.estOra, r.estDestinazione,
        sy, sd, sm, r.esumOra, r.esumDestinazione,
        r.note].map(q).join(';');
    });
    saveFile(`registro-cimiteriale-${stamp()}.csv`, '﻿' + [head.map(q).join(';'), ...rows].join('\r\n'));
  });
  $('btn-backup').addEventListener('click', () => {
    menu.hidden = true;
    saveFile(`registro-cimiteriale-backup-${stamp()}.json`, JSON.stringify({ records: sorted() }, null, 2)).then(ok => {
      if (ok) { try { localStorage.setItem(BK, String(Date.now())); } catch (e) {} updateBackupInfo(); }
    });
  });
  $('btn-restore').addEventListener('click', () => { menu.hidden = true; if (db && !readOnly) $('file-restore').click(); });
  $('file-restore').addEventListener('change', async (e) => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    let recs;
    try { const data = JSON.parse(await file.text()); recs = Array.isArray(data) ? data : data.records; if (!Array.isArray(recs)) throw 0; }
    catch (err) { toast('Il file scelto non è una copia di sicurezza valida.'); return; }
    if (!(await ask(`Aggiungere all'archivio le ${recs.length} registrazioni della copia? Quelle già presenti con lo stesso codice verranno aggiornate.`, 'Ripristina'))) return;
    let ok = 0;
    for (const r of recs) {
      if (!r || typeof r !== 'object') continue;
      const id = /^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(String(r.id || '')) ? String(r.id) : newId();
      const data = {}; FIELDS.forEach(k => { if (r[k] !== undefined) data[k] = r[k]; });
      data.num = +data.num || 0;
      if (await writeDoc(id, data)) ok++; else break;
    }
    toast(`Ripristinate ${ok} registrazioni`);
  });

  updateInfo();
  connect();
})();
</script>
